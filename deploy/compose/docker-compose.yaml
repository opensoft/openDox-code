# Single-node Compose package for the openDox runtime
# (`split-opendox-two-layer-product` § 3.5, RULED Q2: "deployed the way
# `xFactory-Hermes-Install` is"). Its `deploy/compose/docker-compose.yaml` is
# the shape this file takes, with the three-layer install's backup job and
# worker-readiness surface deliberately left out — openDox is a single-layer
# product and neither has a meaning here yet.
#
# Internal-only: no published ports. TLS and ingress terminate at the platform;
# reach the service over the compose network or `docker compose exec`.
#
# SECRETS ENTER BY ENVIRONMENT REFERENCE ONLY. No credential value is committed
# in this file — every `${...}` comes from `deploy/compose/.env`, which is
# gitignored and made from `.env.example`.
#
# THE MIGRATION IDENTITY AND THE SERVED IDENTITY ARE SEPARATE, and that is the
# single most load-bearing thing in this file. The `migrate` service is a
# one-shot, profile-gated executor holding `OPENDOX_MIGRATION_DATABASE_URL`;
# the long-running `opendox` service holds `OPENDOX_DATABASE_URL` and never
# sees the other. `opendox.runtime.config.migration_database_url` refuses to
# fall back from one to the other, so the separation is enforced in code as
# well as declared here.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${OPENDOX_PG_DB:-opendox}
      POSTGRES_USER: ${OPENDOX_PG_USER:-opendox}
      # Supplied at run time by the platform or the local `.env`.
      POSTGRES_PASSWORD: ${OPENDOX_PG_PASSWORD}
      # THE ROLE `init-runtime-role.sh` CREATES, from the ONE name `.env`
      # declares — `OPENDOX_RUNTIME_PG_ROLE`, which is also the runtime setting
      # the migration narrows and the user in `OPENDOX_DATABASE_URL`. This used
      # to read a second `.env` variable of its own, so an operator who set the
      # documented setting created one role and narrowed another and the real
      # served role kept its write on the ledger (Copilot review of
      # openDox-code#25). The container-side name stays what the init script
      # reads.
      OPENDOX_RUNTIME_PG_USER: ${OPENDOX_RUNTIME_PG_ROLE:-opendox_runtime}
      OPENDOX_RUNTIME_PG_PASSWORD: ${OPENDOX_RUNTIME_PG_PASSWORD}
      # THE ROLE THE MIGRATION RUNS AS — the user inside
      # `OPENDOX_MIGRATION_DATABASE_URL`. `alter default privileges` belongs to
      # the role that creates the object, so the bootstrap has to name this one
      # or a migration owner that is not `POSTGRES_USER` creates tables the
      # served role has no rights on (Copilot review of openDox-code#25, round
      # 12). EMPTY means "the same role as POSTGRES_USER", which is the bundled
      # shape; the init script applies that default.
      OPENDOX_MIGRATION_PG_USER: ${OPENDOX_MIGRATION_PG_USER:-}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-runtime-role.sh:/docker-entrypoint-initdb.d/010-runtime-role.sh:ro
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OPENDOX_PG_USER:-opendox} -d ${OPENDOX_PG_DB:-opendox}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  opendox:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
      args:
        SOURCE_REVISION: ${OPENDOX_SOURCE_REVISION:-unknown}
    image: ${OPENDOX_IMAGE:-opendox-runtime:local}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OPENDOX_DATABASE_URL: ${OPENDOX_DATABASE_URL}
      OPENDOX_OIDC_ISSUER: ${OPENDOX_OIDC_ISSUER}
      OPENDOX_OIDC_AUDIENCE: ${OPENDOX_OIDC_AUDIENCE}
      OPENDOX_OIDC_JWKS_URL: ${OPENDOX_OIDC_JWKS_URL:-}
      OPENDOX_OIDC_ALGORITHMS: ${OPENDOX_OIDC_ALGORITHMS:-RS256}
      OPENDOX_OIDC_JWKS_TTL_SECONDS: ${OPENDOX_OIDC_JWKS_TTL_SECONDS:-300}
      OPENDOX_OIDC_LEEWAY_SECONDS: ${OPENDOX_OIDC_LEEWAY_SECONDS:-60}
      OPENDOX_BIND_HOST: ${OPENDOX_BIND_HOST:-0.0.0.0}
      OPENDOX_BIND_PORT: ${OPENDOX_BIND_PORT:-8080}
      OPENDOX_MIGRATIONS_DIR: ${OPENDOX_MIGRATIONS_DIR:-migrations}
      OPENDOX_PROJECT_REPOSITORY_ROOT: ${OPENDOX_PROJECT_REPOSITORY_ROOT:-/var/lib/opendox/projects}
      # THE SCHEMA VIEWERS' SWITCH REACHES THE CONTAINER. `.env.example`
      # documents `OPENDOX_PUBLISH_OPENAPI` and the application reads it, and
      # this service did not pass it — so setting it in the documented `.env`
      # changed nothing and `/docs` stayed 404 with no way to tell why
      # (Copilot review of openDox-code#25). The default is the application's
      # own: OFF.
      OPENDOX_PUBLISH_OPENAPI: ${OPENDOX_PUBLISH_OPENAPI:-false}
    volumes:
      # RULING C3's per-project plain local git repositories. A NAMED VOLUME
      # and not a bind mount: these are repositories the runtime creates and
      # owns, and losing them is losing documents — the one thing RULING Q1's
      # "the database is disposable" does NOT say about this stack.
      #
      # AND THE TARGET IS THE CONFIGURED ROOT. `OPENDOX_PROJECT_REPOSITORY_ROOT`
      # is interpolated above and was NOT interpolated here, so an operator who
      # set the documented root wrote repositories outside the volume — onto a
      # read-only filesystem, or into a layer that dies with the container
      # (Copilot review of openDox-code#25). One expression, both places.
      #
      # AND IN THIS PACKAGE IT MUST BE ABSOLUTE. The application's own default
      # is the RELATIVE `var/projects` — right for a developer running
      # `opendox-runtime` directly — and a container mount target cannot be
      # relative, so an operator who copies that default into `.env` gets an
      # invalid mount rather than a running stack (Copilot review of
      # openDox-code#25, round 13, suppressed). MEASURED on Docker Compose
      # v5.5.1: `docker compose config` ACCEPTS the relative target and the
      # daemon refuses at container creation —
      #   invalid mount path: 'var/projects' mount path must be absolute
      # — so the failure is loud, names the path and happens before anything
      # runs, which is why this stays one expression rather than becoming a
      # fixed literal that would make the documented setting mean nothing here
      # again. `.env.example` says it beside the value, and
      # `tests_runtime/test_deploy_shape.py` holds the documented default
      # absolute and both places to the same expression.
      - project_repositories:${OPENDOX_PROJECT_REPOSITORY_ROOT:-/var/lib/opendox/projects}
    networks:
      - internal
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        # THE CONFIGURED PORT, not a literal 8080. The service accepts
        # `OPENDOX_BIND_PORT`, and a healthcheck that always probed 8080 made
        # any other configured port a permanently unhealthy container — the
        # server listening and the orchestrator restarting it (Copilot review
        # of openDox-code#25). `${VAR:-default}` is interpolated by compose,
        # so the value and the probe cannot drift.
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:${OPENDOX_BIND_PORT:-8080}/livez',timeout=3).status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Privileged one-shot migration executor. Never the long-running application
  # container, and it receives no runtime DSN.
  #   docker compose --profile migration run --rm --build migrate
  #
  # `--build`, because `run` DOES NOT BUILD BY POLICY: it is the only one of
  # `run`, `up` and `create` with no `--no-build` flag, since it has nothing to
  # suppress. The `build:` stanza below says HOW to build this service, not
  # WHEN, so on a clean checkout with the default local image tag the
  # documented first command tried to pull an image that has never existed
  # (Copilot review of openDox-code#25, round 11). `up` needs no flag: by then
  # the image is there, and it would build one if it were not.
  migrate:
    # THE SAME BUILD AS THE SERVED SERVICE. Without it a fresh checkout running
    # the runbook's order — migrate, then up — tries to PULL
    # `opendox-runtime:local`, an image that has never been built and is in no
    # registry, and the documented first command fails (Copilot review of
    # openDox-code#25). Compose reuses the built image for both services.
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
      args:
        SOURCE_REVISION: ${OPENDOX_SOURCE_REVISION:-unknown}
    image: ${OPENDOX_IMAGE:-opendox-runtime:local}
    profiles:
      - migration
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # THE PRIVILEGED DSN AND NOTHING ELSE. `opendox-runtime runtime migrate` reads
      # `load_migration_settings`, which requires this variable alone — so this
      # container carries no served identity, no broker and no second
      # credential. It used to also receive `OPENDOX_DATABASE_URL` set to this
      # same value, purely to satisfy the served loader; that made any path
      # reading `settings.database_url` here schema-privileged and defeated the
      # separation this service exists to keep (Copilot review of
      # openDox-code#25).
      OPENDOX_MIGRATION_DATABASE_URL: ${OPENDOX_MIGRATION_DATABASE_URL}
      OPENDOX_MIGRATIONS_DIR: ${OPENDOX_MIGRATIONS_DIR:-migrations}
      # A ROLE NAME, not a credential: after applying, the runner narrows this
      # role's rights on the migration ledger to SELECT. The SAME `.env` name
      # the Postgres service creates the role from — see that service.
      OPENDOX_RUNTIME_PG_ROLE: ${OPENDOX_RUNTIME_PG_ROLE:-opendox_runtime}
    command: ["opendox-runtime", "runtime", "migrate"]
    networks:
      - internal
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true

networks:
  internal:
    driver: bridge

volumes:
  pg_data:
  project_repositories:
