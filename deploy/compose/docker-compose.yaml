# Single-node Compose package for the openDox runtime
# (`split-opendox-two-layer-product` § 3.5, RULED Q2: "deployed the way
# `xFactory-Hermes-Install` is"). Its `deploy/compose/docker-compose.yaml` is
# the shape this file takes, with the three-layer install's backup job and
# worker-readiness surface deliberately left out — openDox is a single-layer
# product and neither has a meaning here yet.
#
# Internal-only: no published ports. TLS and ingress terminate at the platform;
# reach the service over the compose network or `docker compose exec`.
#
# SECRETS ENTER BY ENVIRONMENT REFERENCE ONLY. No credential value is committed
# in this file — every `${...}` comes from `deploy/compose/.env`, which is
# gitignored and made from `.env.example`.
#
# THE MIGRATION IDENTITY AND THE SERVED IDENTITY ARE SEPARATE, and that is the
# single most load-bearing thing in this file. The `migrate` service is a
# one-shot, profile-gated executor holding `OPENDOX_MIGRATION_DATABASE_URL`;
# the long-running `opendox` service holds `OPENDOX_DATABASE_URL` and never
# sees the other. `opendox.runtime.config.migration_database_url` refuses to
# fall back from one to the other, so the separation is enforced in code as
# well as declared here.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${OPENDOX_PG_DB:-opendox}
      POSTGRES_USER: ${OPENDOX_PG_USER:-opendox}
      # Supplied at run time by the platform or the local `.env`.
      POSTGRES_PASSWORD: ${OPENDOX_PG_PASSWORD}
      OPENDOX_RUNTIME_PG_USER: ${OPENDOX_RUNTIME_PG_USER:-opendox_runtime}
      OPENDOX_RUNTIME_PG_PASSWORD: ${OPENDOX_RUNTIME_PG_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-runtime-role.sh:/docker-entrypoint-initdb.d/010-runtime-role.sh:ro
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OPENDOX_PG_USER:-opendox} -d ${OPENDOX_PG_DB:-opendox}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  opendox:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
      args:
        SOURCE_REVISION: ${OPENDOX_SOURCE_REVISION:-unknown}
    image: ${OPENDOX_IMAGE:-opendox-runtime:local}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OPENDOX_DATABASE_URL: ${OPENDOX_DATABASE_URL}
      OPENDOX_OIDC_ISSUER: ${OPENDOX_OIDC_ISSUER}
      OPENDOX_OIDC_AUDIENCE: ${OPENDOX_OIDC_AUDIENCE}
      OPENDOX_OIDC_JWKS_URL: ${OPENDOX_OIDC_JWKS_URL:-}
      OPENDOX_OIDC_ALGORITHMS: ${OPENDOX_OIDC_ALGORITHMS:-RS256}
      OPENDOX_OIDC_JWKS_TTL_SECONDS: ${OPENDOX_OIDC_JWKS_TTL_SECONDS:-300}
      OPENDOX_OIDC_LEEWAY_SECONDS: ${OPENDOX_OIDC_LEEWAY_SECONDS:-60}
      OPENDOX_BIND_HOST: ${OPENDOX_BIND_HOST:-0.0.0.0}
      OPENDOX_BIND_PORT: ${OPENDOX_BIND_PORT:-8080}
      OPENDOX_MIGRATIONS_DIR: ${OPENDOX_MIGRATIONS_DIR:-migrations}
      OPENDOX_PROJECT_REPOSITORY_ROOT: ${OPENDOX_PROJECT_REPOSITORY_ROOT:-/var/lib/opendox/projects}
    volumes:
      # RULING C3's per-project plain local git repositories. A NAMED VOLUME
      # and not a bind mount: these are repositories the runtime creates and
      # owns, and losing them is losing documents — the one thing RULING Q1's
      # "the database is disposable" does NOT say about this stack.
      - project_repositories:/var/lib/opendox/projects
    networks:
      - internal
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/livez',timeout=3).status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Privileged one-shot migration executor. Never the long-running application
  # container, and it receives no runtime DSN.
  #   docker compose --profile migration run --rm migrate
  migrate:
    # THE SAME BUILD AS THE SERVED SERVICE. Without it a fresh checkout running
    # the runbook's order — migrate, then up — tries to PULL
    # `opendox-runtime:local`, an image that has never been built and is in no
    # registry, and the documented first command fails (Copilot review of
    # openDox-code#25). Compose reuses the built image for both services.
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
      args:
        SOURCE_REVISION: ${OPENDOX_SOURCE_REVISION:-unknown}
    image: ${OPENDOX_IMAGE:-opendox-runtime:local}
    profiles:
      - migration
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # THE PRIVILEGED DSN AND NOTHING ELSE. `opendox-runtime migrate` reads
      # `load_migration_settings`, which requires this variable alone — so this
      # container carries no served identity, no broker and no second
      # credential. It used to also receive `OPENDOX_DATABASE_URL` set to this
      # same value, purely to satisfy the served loader; that made any path
      # reading `settings.database_url` here schema-privileged and defeated the
      # separation this service exists to keep (Copilot review of
      # openDox-code#25).
      OPENDOX_MIGRATION_DATABASE_URL: ${OPENDOX_MIGRATION_DATABASE_URL}
      OPENDOX_MIGRATIONS_DIR: ${OPENDOX_MIGRATIONS_DIR:-migrations}
    command: ["opendox-runtime", "runtime", "migrate"]
    networks:
      - internal
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true

networks:
  internal:
    driver: bridge

volumes:
  pg_data:
  project_repositories:
