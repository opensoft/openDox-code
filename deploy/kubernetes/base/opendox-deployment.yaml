# The openDox runtime Deployment (`split-opendox-two-layer-product` § 3.5,
# RULED Q2: "deployed the way `xFactory-Hermes-Install` is"). Non-root,
# read-only root filesystem, resource limits, and a DSN that is a SECRET
# REFERENCE and never a literal.
#
# ONE REPLICA, DELIBERATELY. The pod mounts the per-project git repositories
# read-write (see `project-repositories-pvc.yaml`) and git's object store has
# no cross-writer protocol over a shared filesystem. This is a property of
# RULING C3's standalone shape, not a capacity decision, and it is recorded
# here so a later scale-up is an act somebody takes on purpose.
#
# THE MIGRATION DSN IS NOT MOUNTED HERE. `migration-job.yaml` holds it. The
# runtime's own `config.migration_database_url` refuses to fall back to
# `OPENDOX_DATABASE_URL`, so this separation cannot be undone by a container
# that happens to have one of them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opendox-runtime
  namespace: opendox
spec:
  replicas: 1
  strategy:
    # Recreate and not RollingUpdate: two pods would hold the same
    # ReadWriteOnce repository volume, which is the corruption the replica
    # count above exists to avoid.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: opendox-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opendox-runtime
    spec:
      # This pod never calls the Kubernetes API, so a usable API-server token
      # in an internet-adjacent container is reach it does not need.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opendox-runtime
          # Name + version tag in the neutral base; the reviewed digest is
          # stamped by the overlay's `images:` entry at the release step.
          image: ghcr.io/opensoft/opendox-runtime:0.0.0
          # `command:` AND NOT `args:`. The image declares `CMD` and no
          # `ENTRYPOINT`, and Kubernetes `args` replaces CMD's ARGUMENTS while
          # leaving the entrypoint empty — so with `args:` this pod had no
          # executable to run and would not have started at all (Copilot review
          # of openDox-code#25; the compose file already used the right form).
          command: ["opendox-runtime", "runtime", "serve"]
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          env:
            # The RUNTIME DSN: the least-privileged identity, by reference.
            - name: OPENDOX_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: opendox-db-runtime
                  key: dsn
            # Non-secret OIDC bindings from the ConfigMap. These are
            # references to public facts about the broker, not credentials.
            - name: OPENDOX_OIDC_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: opendox-oidc
                  key: oidc_issuer
            - name: OPENDOX_OIDC_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: opendox-oidc
                  key: oidc_audience
            - name: OPENDOX_OIDC_JWKS_URL
              valueFrom:
                configMapKeyRef:
                  name: opendox-oidc
                  key: oidc_jwks_url
            - name: OPENDOX_OIDC_ALGORITHMS
              valueFrom:
                configMapKeyRef:
                  name: opendox-oidc
                  key: oidc_algorithms
            - name: OPENDOX_OIDC_JWKS_TTL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: opendox-oidc
                  key: oidc_jwks_ttl_seconds
            - name: OPENDOX_OIDC_LEEWAY_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: opendox-oidc
                  key: oidc_leeway_seconds
            - name: OPENDOX_BIND_HOST
              value: "0.0.0.0"
            - name: OPENDOX_BIND_PORT
              value: "8080"
            - name: OPENDOX_MIGRATIONS_DIR
              value: "migrations"
            - name: OPENDOX_PROJECT_REPOSITORY_ROOT
              value: "/var/lib/opendox/projects"
            # The schema viewers' switch — a DECISION, so it comes from the
            # ConfigMap an overlay edits rather than from this file.
            - name: OPENDOX_PUBLISH_OPENAPI
              valueFrom:
                configMapKeyRef:
                  name: opendox-runtime-config
                  key: publish_openapi
          livenessProbe:
            # `/livez` answers before any dependency is reachable, so a broker
            # outage is never mistaken for a dead process and restarted.
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            # `/readyz` reports the database and the broker's key set by name.
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: project-repositories
              mountPath: /var/lib/opendox/projects
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: project-repositories
          persistentVolumeClaim:
            claimName: opendox-project-repositories
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
