# The PRIVILEGED one-shot migration executor — the Kubernetes counterpart of
# the compose package's `migrate` profile, and the only workload in this
# namespace that receives `OPENDOX_MIGRATION_DATABASE_URL`.
#
# A Job and not an initContainer of the Deployment: an initContainer would run
# on every pod restart with the privileged DSN mounted into the same pod spec
# as the served application, which is the separation this file exists to keep.
#
# IT HAS A FIXED NAME, AND RE-RUNNING IT IS A DELIBERATE ACT. A Job's pod
# template is immutable, so a second `kubectl apply` of this manifest after the
# first run does NOT start a new migration — it fails to patch the template and
# the later migrations are silently not applied (Copilot review of
# openDox-code#25). That is a property of Jobs, not of this file, and the
# answer is to say so rather than to pretend an apply loop covers it. The
# runbook (`docs/runtime.md` § 6) states the re-run:
#
#     kubectl -n opendox delete job opendox-migrate --ignore-not-found
#     kustomize build deploy/kubernetes/overlays/dev | kubectl apply -f -
#
# `ttlSecondsAfterFinished` below lets the cluster reap a finished run on its
# own, so the delete is usually a no-op; it is in the runbook because "usually"
# is not a migration guarantee.
apiVersion: batch/v1
kind: Job
metadata:
  name: opendox-migrate
  namespace: opendox
spec:
  backoffLimit: 2
  # Reaped an hour after it finishes, so the next `kubectl apply` meets no
  # immutable template. See the note above for why the runbook still names the
  # explicit delete.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opendox-migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/opensoft/opendox-runtime:0.0.0
          # `command:`, for the reason the Deployment states: the image has a
          # `CMD` and no `ENTRYPOINT`, so `args:` alone leaves Kubernetes with
          # no executable.
          command: ["opendox-runtime", "runtime", "migrate"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            # THE PRIVILEGED DSN AND NOTHING ELSE. `opendox-runtime migrate`
            # reads `load_migration_settings`, which requires this variable
            # alone, so this pod carries no served identity and no broker
            # binding. It used to also receive `OPENDOX_DATABASE_URL` from the
            # same Secret purely to satisfy the served loader — which made any
            # path reading `settings.database_url` in this pod
            # schema-privileged and defeated the boundary this Job exists to
            # keep (Copilot review of openDox-code#25).
            - name: OPENDOX_MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: opendox-db-migration
                  key: dsn
            - name: OPENDOX_MIGRATIONS_DIR
              value: "migrations"
            # A ROLE NAME, not a credential; see the compose file's note.
            - name: OPENDOX_RUNTIME_PG_ROLE
              value: "opendox_runtime"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
