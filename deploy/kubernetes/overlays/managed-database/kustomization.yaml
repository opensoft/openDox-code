# THE MANAGED-DATABASE PATH, AS A THING THAT EXISTS rather than a paragraph.
# `docs/runtime.md` told an operator to point both DSNs at a managed database
# and empty `migration_wait_host`, and stopped there — while the base still
# carries `postgres-statefulset.yaml` and `postgres-service.yaml`. Following
# those steps started a SECOND database nobody uses, and failed on the
# `opendox-postgres` Secret the StatefulSet mounts and this path never creates
# (Copilot review of openDox-code#25, round 19, suppressed). An overlay is the
# only place kustomize can remove a base resource, so the instruction that
# needs one ships with one.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: opendox

resources:
  - ../../base

# The bundled Postgres, removed. `$patch: delete` names the resource by kind
# and name; the Service goes with it, because a Service in front of no pods is
# a name that resolves to nothing and would make `migration_wait_host` look
# reachable.
patches:
  - target:
      kind: StatefulSet
      name: opendox-postgres
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: opendox-postgres
      $patch: delete
  - target:
      kind: Service
      name: opendox-postgres
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: opendox-postgres
      $patch: delete
  # And the init script that created the served role on the bundled Postgres's
  # FIRST START. A managed database runs no init script — which is exactly why
  # the runbook makes provisioning that role a prerequisite — so shipping the
  # ConfigMap would leave an artefact nothing mounts and imply a bootstrap that
  # does not happen here.
  - target:
      kind: ConfigMap
      name: opendox-postgres-init
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: opendox-postgres-init
      $patch: delete

# AND THE WAIT IS EMPTIED HERE, not left to a hand edit of the ConfigMap. The
# migration Job's readiness gate exits immediately when this is empty, which is
# right: there is no Service in this cluster to wait for.
configMapGenerator:
  - name: opendox-runtime-config
    behavior: merge
    options:
      disableNameSuffixHash: true
    literals:
      - migration_wait_host=
  - name: opendox-oidc
    behavior: merge
    options:
      disableNameSuffixHash: true
    literals:
      - oidc_issuer=https://keycloak.dev.example/realms/opendox
      - oidc_audience=opendox-runtime

# AND THE BROKER, BECAUSE THE RUNBOOK BUILDS THIS OVERLAY DIRECTLY. The base's
# `opendox-oidc` ConfigMap deliberately leaves `oidc_issuer` and
# `oidc_audience` EMPTY — they are an environment's facts, not a repository's —
# so an overlay that supplies neither renders a Deployment that fails
# `load_settings` before it serves. `overlays/dev` carries a worked example for
# exactly that reason and this one had none, while the runbook told an operator
# to apply it (Copilot review of openDox-code#25, round 22). The values below
# are the same worked example, and a real environment replaces them — it is the
# `dev` overlay's own sentence, and it is the reason this file is a worked
# example rather than a deployment.

# The image is the environment's, exactly as in `dev`: an `newTag:` here pins
# nothing and says so, and a real environment replaces it with `digest:`.
images:
  - name: ghcr.io/opensoft/opendox-runtime
    newTag: "0.0.0"
