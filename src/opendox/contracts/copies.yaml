# THE RECORD of openDox's packaged contract copies (plan 034 T057; #1144 7.1,
# as T007's batch G amends it; R1Q12 (a), opensoft/openxFactory#656 comment
# 5850003126).
#
# WHAT IT SAYS. Each schema under `schemas/` beside this file is, byte for byte,
# the file its `path` names in `spec_leg` at `commit`, and `sha256` is that
# file's digest. `opendox.contracts.verified_bytes` recomputes the digest before
# a copy is read, and refuses a copy that differs, a copy that is absent, and a
# copy whose digest is left empty.
#
# WHERE THE VALUES CAME FROM, read with `git show <commit>:<path> | sha256sum`
# in opensoft/openDox-spec.
#
# * `commit` is the spec-leg commit the openDox root pins: T040 as landed,
#   openDox-spec#17's squash 7db9438b, which the root's `contracts/spec-pin.yaml`
#   and `spec` gitlink name since opensoft/openDox#20 (plan 038 T060,
#   dox-v1.2). It is the one commit that carries all five files.
# * Each digest is the one the root's `contracts/manifest.yaml` records for that
#   file at that commit. Four of the five files are unchanged from the root's
#   previous spec pin, f7ee3c76 (T053, dox-v1.1). The fifth is T040's
#   `opendox-health-finding`, which plan 038's T041 copies here.
#
# WHAT THE FIVE ARE (7.1, as T007's batch G amends it and T005's batch Q adds
# to it; N-15). Four are the schemas of the validator's kinds. The fifth is
# the finding's neutral shape: a copy the health engine reads, and no kind the
# validator validates, because a finding's `kind` is its family and no `kind`
# constant can name the schema. `opendox.health_contract` mirrors it.
#
# `commit` moved here from f7ee3c76 in lockstep with the root's spec pin (T041).
# openDox-spec#17 only added files, so no digest of the four moved. Before
# that, it moved from openDox-spec#16's head, cd49eb25, to its squash f7ee3c76,
# which has cd49eb25's tree. A digest moves only when its file changes.
#
# NEVER EDIT A COPY OR A DIGEST IN PLACE. A copy changes in the spec leg. It
# arrives here when the spec leg's file is copied at the pinned commit and its
# digest recorded, in one commit.
