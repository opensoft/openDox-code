# openDox's own neutral snapshot contract (plan 034, T053).
#
# WHY THIS FILE IS JSON. It is YAML whose body is one JSON object, and that is
# deliberate. The leg's required `validate` check installs pytest and nothing
# else, so `tests/test_opendox_snapshot_contract.py` reads this file with
# Python's built-in `json` module once these comment lines are set aside.
# JSON is YAML, so every YAML loader in the family reads the same object, and
# the same test proves that PyYAML agrees wherever PyYAML is installed. This
# leg's negative chat-turn examples already take this form.
#
# SECTIONS. openDox's views render six stations from five sections, as
# openDox's own STAGE_FIELDS declares them: source reads documents, grouping
# reads clusters, candidate reads possibles, selection reads staged_topics,
# and the submission and completion stations read the changes entries whose
# status is active and archived. Every station section is required, and it
# is an empty list when its station holds nothing. keyword_index is optional:
# without it, a reader derives the keyword rail from the documents' topics.
#
# CLOSED VALUES, all neutral. A document's stage is one of the six station
# role keys, a candidate's state is one of unselected, selected, declined and
# replaced, and a changes entry's status is active or archived. openDox's
# views match them through SNAPSHOT_VALUES, whose defaults T054 moves to
# these values.
#
# DETERMINISTIC, which is the generator's to keep and no schema can check: the
# same tree yields a byte-identical snapshot, so nothing in it records when
# the generator ran. generated_at, when present, is fixed by the source
# revision (its commit date, or a date recorded with it), never read from the
# clock. FORWARD-COMPATIBLE. A reader ignores unknown properties, so no object
# sets additionalProperties false, and an additive field needs no
# schema_version bump.
#
# RULES. Every rule has an identifier. A subschema names, in x-rule, the rule
# its keywords enforce; x-rules lists every rule with its class; and a
# validator's refusal names the rule it broke. A shape rule is enforced by
# this schema's own keywords. A reference rule is a cross-reference that no
# JSON Schema keyword can state, so a validator enforces it.
{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "opendox-snapshot.schema.yaml",
  "title": "openDox neutral snapshot",
  "contract_schema_version": 1,
  "description": "openDox's own snapshot: what its neutral generator writes over a plain repository, and what its views read, with no consumer installed (plan 034 T053, on R1Q11 (a) and R1Q12 (a): opensoft/openxFactory issue 656, comment 5850003126). openXdox's governed generator keeps its own contract, openXdox-spec's ideation-dashboard-snapshot, which this schema leaves unchanged; a contributed generator declares which of the two kinds it writes (T052). The file's comment header, the section descriptions and the x-rules catalog say the rest.",
  "x-rule": "envelope-keys",
  "type": "object",
  "required": [
    "schema_version",
    "kind",
    "repository",
    "generation",
    "documents",
    "clusters",
    "possibles",
    "staged_topics",
    "changes"
  ],
  "properties": {
    "schema_version": {"x-rule": "schema-version-is-1", "const": 1},
    "kind": {"x-rule": "kind-is-opendox-snapshot", "const": "opendox-snapshot"},
    "repository": {"x-rule": "repository-is-text", "type": "string", "minLength": 1},
    "generation": {"$ref": "#/$defs/generation"},
    "documents": {
      "description": "The source station, and the product's whole document list: every document the corpus adapter lists, in the station its stage names. Every entry carries its stage, and no reader supplies one: the generator writes source for a document that declares no stage.",
      "x-rule": "section-is-a-list",
      "type": "array",
      "items": {"$ref": "#/$defs/document"}
    },
    "clusters": {
      "description": "The grouping station: the groups that form around topics documents share, each with one edge per member document.",
      "x-rule": "section-is-a-list",
      "type": "array",
      "items": {"$ref": "#/$defs/group"}
    },
    "possibles": {
      "description": "The candidate station.",
      "x-rule": "section-is-a-list",
      "type": "array",
      "items": {"$ref": "#/$defs/candidate"}
    },
    "staged_topics": {
      "description": "The selection station.",
      "x-rule": "section-is-a-list",
      "type": "array",
      "items": {"$ref": "#/$defs/selection"}
    },
    "changes": {
      "description": "The submission station (status active) and the completion station (status archived), which share this one section.",
      "x-rule": "section-is-a-list",
      "type": "array",
      "items": {"$ref": "#/$defs/submission"}
    },
    "keyword_index": {
      "description": "Optional. The keyword rail's seed. When present, every topic the documents carry has one entry, and each entry counts the documents that carry its keyword.",
      "x-rule": "section-is-a-list",
      "type": "array",
      "items": {"$ref": "#/$defs/keyword_entry"}
    }
  },
  "$defs": {
    "id": {"x-rule": "id-is-text", "type": "string", "minLength": 1},
    "path": {
      "description": "A path relative to the repository root, as the corpus adapter lists it.",
      "x-rule": "path-is-repo-relative",
      "type": "string",
      "pattern": "^(?!/)(?![A-Za-z]:)(?![\\s\\S]*[\\\\\\u0000-\\u001f\\u007f-\\u009f])(?!(?:[\\s\\S]*/)?\\.\\.(?:/|$))[\\s\\S]+$"
    },
    "topic": {
      "x-rule": "topic-is-trimmed-text",
      "type": "string",
      "pattern": "^(?![\\s\\ufeff])(?![\\s\\S]*[\\s\\ufeff]$)[^\\u0000-\\u001f\\u007f-\\u009f]+$"
    },
    "stage_role": {
      "description": "The station a document sits in: one of the six station role keys, in spine order, exactly openDox's display_profile.STAGE_ROLES. The set is closed. A declared value outside it is not a declaration: the generator reads that document as a source and writes stage source, so the value never reaches a snapshot.",
      "x-rule": "stage-is-a-station-role",
      "enum": ["source", "grouping", "candidate", "selection", "submission", "completion"]
    },
    "candidate_state": {
      "description": "A candidate's state, in openDox's own words for the candidate station (NEUTRAL_DISPLAY's candidate vocabulary). A candidate is unselected until an act selects, declines or replaces it.",
      "x-rule": "candidate-state-is-known",
      "enum": ["unselected", "selected", "declined", "replaced"]
    },
    "submission_status": {
      "description": "The station a changes entry sits in: active for submission, archived for completion, as openDox's STAGE_FIELDS declares them.",
      "x-rule": "submission-status-is-known",
      "enum": ["active", "archived"]
    },
    "generation": {
      "description": "The generation stamp. source_revision is the determinism anchor: the tree revision the snapshot projects.",
      "x-rule": "generation-anchored",
      "type": "object",
      "required": ["source_revision"],
      "properties": {
        "source_revision": {"x-rule": "generation-anchored", "type": "string", "minLength": 1},
        "generated_at": {
          "x-rule": "generated-at-is-rfc3339",
          "type": "string",
          "format": "date-time",
          "pattern": "^(?![\\s\\S]*[\\u0000-\\u001f\\u007f-\\u009f])(?!0000)(?:[0-9]{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12][0-9]|3[01])|(?:0[469]|11)-(?:0[1-9]|[12][0-9]|30)|02-(?:0[1-9]|1[0-9]|2[0-8]))|(?:[0-9]{2}(?:0[48]|[2468][048]|[13579][26])|(?:[02468][048]|[13579][26])00)-02-29)[Tt](?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\\.[0-9]+)?(?:[Zz]|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$"
        },
        "generator_version": {"x-rule": "generation-anchored", "type": "string", "minLength": 1}
      }
    },
    "document": {
      "description": "One document the corpus adapter lists. title and summary are the default adapter's small neutral field set (R1Q13 (a)). Neither is required, and the generator writes null for one the document does not give. topics, which every entry carries, are the topics the generator assigns: the ones the document declares, or the ones its topic rule derives when it declares none, and an empty list when there are none.",
      "x-rule": "document-keys",
      "type": "object",
      "required": ["id", "path", "stage", "topics"],
      "properties": {
        "id": {"$ref": "#/$defs/id"},
        "path": {"$ref": "#/$defs/path"},
        "stage": {"$ref": "#/$defs/stage_role"},
        "title": {
          "x-rule": "title-and-summary-are-text",
          "type": ["string", "null"],
          "minLength": 1
        },
        "summary": {
          "x-rule": "title-and-summary-are-text",
          "type": ["string", "null"],
          "minLength": 1
        },
        "topics": {
          "x-rule": "topics-are-unique",
          "type": "array",
          "uniqueItems": true,
          "items": {"$ref": "#/$defs/topic"}
        }
      }
    },
    "group": {
      "description": "One group in the grouping station. document_edges holds one edge per member document, naming the topics that matched; the funnel draws them.",
      "x-rule": "group-keys",
      "type": "object",
      "required": ["id", "name", "topics", "document_edges"],
      "properties": {
        "id": {"$ref": "#/$defs/id"},
        "name": {"x-rule": "group-keys", "type": "string", "minLength": 1},
        "topics": {
          "x-rule": "group-has-a-topic",
          "type": "array",
          "minItems": 1,
          "uniqueItems": true,
          "items": {"$ref": "#/$defs/topic"}
        },
        "document_edges": {
          "x-rule": "group-keys",
          "type": "array",
          "items": {"$ref": "#/$defs/edge"}
        }
      }
    },
    "edge": {
      "x-rule": "edge-keys",
      "type": "object",
      "required": ["document", "matched_topics"],
      "properties": {
        "document": {"$ref": "#/$defs/id"},
        "matched_topics": {
          "x-rule": "edge-keys",
          "type": "array",
          "minItems": 1,
          "uniqueItems": true,
          "items": {"$ref": "#/$defs/topic"}
        }
      }
    },
    "candidate": {
      "description": "One candidate in the candidate station. claiming_clusters holds the groups that claim it; pick holds the selection a selected candidate went to.",
      "x-rule": "candidate-keys",
      "type": "object",
      "required": ["id", "title", "state"],
      "properties": {
        "id": {"$ref": "#/$defs/id"},
        "title": {"x-rule": "candidate-keys", "type": "string", "minLength": 1},
        "claim": {"x-rule": "candidate-keys", "type": "string", "minLength": 1},
        "state": {"$ref": "#/$defs/candidate_state"},
        "claiming_clusters": {
          "x-rule": "candidate-keys",
          "type": "array",
          "uniqueItems": true,
          "items": {"$ref": "#/$defs/id"}
        },
        "pick": {
          "x-rule": "selected-candidate-has-pick",
          "type": "object",
          "required": ["staging_id"],
          "properties": {"staging_id": {"$ref": "#/$defs/id"}}
        },
        "reason": {"x-rule": "closed-candidate-has-reason", "type": "string", "minLength": 1}
      },
      "allOf": [
        {
          "if": {"required": ["state"], "properties": {"state": {"const": "selected"}}},
          "then": {"x-rule": "selected-candidate-has-pick", "required": ["pick"]}
        },
        {
          "if": {"required": ["state"], "properties": {"state": {"enum": ["declined", "replaced"]}}},
          "then": {"x-rule": "closed-candidate-has-reason", "required": ["reason"]}
        }
      ]
    },
    "selection": {
      "description": "One selection in the selection station. files lists what it is made of, and target_change names the changes entry it went on to.",
      "x-rule": "selection-keys",
      "type": "object",
      "required": ["staging_id"],
      "properties": {
        "staging_id": {"$ref": "#/$defs/id"},
        "files": {
          "x-rule": "selection-keys",
          "type": "array",
          "uniqueItems": true,
          "items": {"$ref": "#/$defs/path"}
        },
        "target_change": {"$ref": "#/$defs/id"}
      }
    },
    "submission": {
      "description": "One entry of the submission or the completion station. files lists what it is made of, as a selection's files do, and the tile opens onto them.",
      "x-rule": "submission-keys",
      "type": "object",
      "required": ["id", "status"],
      "properties": {
        "id": {"$ref": "#/$defs/id"},
        "status": {"$ref": "#/$defs/submission_status"},
        "files": {
          "x-rule": "submission-keys",
          "type": "array",
          "uniqueItems": true,
          "items": {"$ref": "#/$defs/path"}
        }
      }
    },
    "keyword_entry": {
      "description": "declared_doc_count counts the documents whose topics carry the keyword.",
      "x-rule": "keyword-entry-keys",
      "type": "object",
      "required": ["keyword", "declared_doc_count"],
      "properties": {
        "keyword": {"$ref": "#/$defs/topic"},
        "declared_doc_count": {"x-rule": "keyword-entry-keys", "type": "integer", "minimum": 0}
      }
    }
  },
  "x-rules": [
    {
      "id": "envelope-keys",
      "class": "shape",
      "says": "A snapshot is an object carrying schema_version, kind, repository, generation and the five station sections: documents, clusters, possibles, staged_topics and changes."
    },
    {"id": "schema-version-is-1", "class": "shape", "says": "schema_version is 1."},
    {
      "id": "kind-is-opendox-snapshot",
      "class": "shape",
      "says": "kind is opendox-snapshot. The governed generator's ideation-dashboard-snapshot is a different contract, and this schema refuses it."
    },
    {
      "id": "repository-is-text",
      "class": "shape",
      "says": "repository, the canonical id of the repository the snapshot projects, is non-empty text."
    },
    {
      "id": "generation-anchored",
      "class": "shape",
      "says": "generation is an object carrying source_revision, the revision of the tree the snapshot projects, as non-empty text; generator_version, when present, is non-empty text too."
    },
    {
      "id": "generated-at-is-rfc3339",
      "class": "shape",
      "says": "generation.generated_at, when present, is an RFC 3339 date-time on a day the calendar has (the pattern knows each month's length and the leap years), with no control character. It is narrower than RFC 3339 in two places. Its year is never 0000, which Python's datetime cannot hold. Its seconds run from 00 to 59 and are never a leap second's 60, which a git commit date cannot hold and neither Python's datetime nor a browser's Date can read. jsonschema's date-time checker refuses both. It is fixed by the source revision, never read from the clock."
    },
    {
      "id": "section-is-a-list",
      "class": "shape",
      "says": "Each section is a list: documents, clusters, possibles, staged_topics, changes and, when present, keyword_index. A station with nothing in it is an empty list."
    },
    {
      "id": "id-is-text",
      "class": "shape",
      "says": "Every entry id, and every reference to one, is non-empty text."
    },
    {
      "id": "document-keys",
      "class": "shape",
      "says": "A document is an object carrying id, path, stage and topics."
    },
    {
      "id": "path-is-repo-relative",
      "class": "shape",
      "says": "A path is relative to the repository root: it does not start with a slash or with a drive letter and a colon (C:/x or C:x, which Windows joins onto a root as a path outside it), holds no backslash and no control character (U+0000 to U+001F, U+007F to U+009F), and has no .. segment."
    },
    {
      "id": "stage-is-a-station-role",
      "class": "shape",
      "says": "A document's stage is one of the six station role keys: source, grouping, candidate, selection, submission, completion."
    },
    {
      "id": "title-and-summary-are-text",
      "class": "shape",
      "says": "A document's title and summary are each non-empty text, or null."
    },
    {
      "id": "topics-are-unique",
      "class": "shape",
      "says": "A document's topics are a list that names each topic once."
    },
    {
      "id": "topic-is-trimmed-text",
      "class": "shape",
      "says": "A topic is non-empty text with no leading or trailing whitespace and no control character (U+0000 to U+001F, U+007F to U+009F). Whitespace is what both Python and a browser count as whitespace, U+FEFF included, so both refuse the same topics."
    },
    {
      "id": "group-keys",
      "class": "shape",
      "says": "A group (a clusters entry) is an object carrying id, name, topics and document_edges. Its name is non-empty text, and its edges are a list."
    },
    {
      "id": "group-has-a-topic",
      "class": "shape",
      "says": "A group's topics name at least one topic, each once: a group forms around topics that its documents share."
    },
    {
      "id": "edge-keys",
      "class": "shape",
      "says": "A group's document edge is an object that names the document and at least one matched topic, each once."
    },
    {
      "id": "candidate-keys",
      "class": "shape",
      "says": "A candidate (a possibles entry) is an object carrying id, title and state. Its title, and its claim when present, are non-empty text; claiming_clusters, when present, names each group once."
    },
    {
      "id": "candidate-state-is-known",
      "class": "shape",
      "says": "A candidate's state is one of unselected, selected, declined and replaced."
    },
    {
      "id": "selected-candidate-has-pick",
      "class": "shape",
      "says": "A selected candidate carries pick, an object whose staging_id names the selection it went to."
    },
    {
      "id": "closed-candidate-has-reason",
      "class": "shape",
      "says": "A declined or replaced candidate carries reason, non-empty text that says why."
    },
    {
      "id": "selection-keys",
      "class": "shape",
      "says": "A selection (a staged_topics entry) is an object carrying staging_id; files, when present, lists repository-relative paths, each once."
    },
    {
      "id": "submission-keys",
      "class": "shape",
      "says": "A changes entry, a submission or a completed item, is an object carrying id and status; files, when present, lists repository-relative paths, each once."
    },
    {
      "id": "submission-status-is-known",
      "class": "shape",
      "says": "A changes entry's status is active (the submission station) or archived (the completion station)."
    },
    {
      "id": "keyword-entry-keys",
      "class": "shape",
      "says": "A keyword_index entry is an object carrying keyword and declared_doc_count, a whole number no less than 0."
    },
    {
      "id": "ids-are-unique",
      "class": "reference",
      "says": "Within each section, entry ids are unique: documents, clusters, possibles and changes by id, and staged_topics by staging_id."
    },
    {
      "id": "edge-names-a-document",
      "class": "reference",
      "says": "Every group edge names a document in documents."
    },
    {
      "id": "one-edge-per-document",
      "class": "reference",
      "says": "Within one group, the edges name each document once: one edge per member document. A document may feed several groups."
    },
    {
      "id": "candidate-names-a-group",
      "class": "reference",
      "says": "Every group that a candidate's claiming_clusters names is in clusters."
    },
    {
      "id": "pick-names-a-selection",
      "class": "reference",
      "says": "A candidate's pick.staging_id names a selection in staged_topics."
    },
    {
      "id": "target-names-a-submission",
      "class": "reference",
      "says": "A selection's target_change names an entry in changes."
    },
    {
      "id": "keyword-index-matches-topics",
      "class": "reference",
      "says": "keyword_index, when present, agrees with the documents: every topic a document carries has an entry, no keyword has two, and each entry's declared_doc_count is the number of documents that carry its keyword, 0 for a keyword that none carries."
    }
  ]
}
