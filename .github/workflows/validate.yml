name: validate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # THE WHOLE SUITE, IN THE ONE REQUIRED JOB — plan 034 T036 (#1144
  # requirement 9, FR-006: "openDox-code: the whole suite ... No exclusion is
  # declared"; RULED R1Q8 (a), openxFactory#656 comment 5817152735).
  #
  # WHAT THIS JOB USED TO RUN, in one paragraph, because the record of it is
  # this file's own history. Under RULED Q-L5 (b′) (openxFactory#656,
  # 2026-09-10) the tree could not import `opendox.serve` standalone, so this
  # job ran three pytest steps over explicit file lists, each with the conftest
  # chain switched off, and every file named had to stand on its own. The
  # comment blocks beside those lists recorded why each file was there and why
  # the rest were not; they are in this file at every commit before T036.
  # Plan 034's phase 1 removed the reaches that forced the narrowing (T011,
  # T032), and T035 emptied the root conftest's `collect_ignore`. So there is
  # no list left to keep.
  #
  # WHAT IT RUNS NOW: `python -m pytest -q`, and nothing names a file.
  # `pyproject.toml`'s `testpaths` (`tests`, `tests_runtime`) is the suite, and
  # the conftest chain is in play for all of it.
  #
  # THE DB-BACKED HALF RUNS HERE TOO (R1Q8 (a)). It used to run in a separate
  # `runtime` job that was advisory, never required (RULED Q-R3,
  # openxFactory#656 comment 5701772032: advisory until "a separate DECLARED
  # act"). R1Q8 (a) is that act. T036 says the `runtime` job "may then be
  # folded in", and it is: this job now carries that job's `postgres:16`
  # service, its `.[runtime,test]` install and its DSN, so the database-backed
  # suites are in the required check and nothing runs twice.
  #
  # AND THEY FAIL HERE RATHER THAN SKIP. `CI` is set on every GitHub runner,
  # and `tests_runtime/conftest.py` turns a missing database, a missing
  # `runtime` extra or a broken key pair into a FAILURE under `CI` (a developer
  # without Postgres gets a skip with the reason printed). pytest exits 0 when
  # every collected case is skipped, so without that rule a job whose service
  # failed to start would report green having made no database-backed
  # assertion at all (Copilot review of openDox-code#25, round 5).
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: opendox
          # A throwaway CI credential for a service container reachable only
          # from this job's own network namespace, torn down with the job. No
          # real secret is ever written into a workflow file — the runtime's
          # own DSNs are Secret references everywhere they appear
          # (`deploy/kubernetes/base/`), and `tests_runtime/test_deploy_shape.py`
          # refuses a committed credential value. Marked at the end of the line
          # below on the estate's own precedent:
          # `xFactory-Hermes-Install/.github/workflows/ci.yml` marks its
          # identical Postgres password the same way.
          POSTGRES_PASSWORD: opendox # NOSONAR # NOSONAR
          POSTGRES_DB: opendox
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # INSTALL THE PACKAGE, not just the runner — RULED Q-L2 (openxFactory#656,
      # 2026-09-10). This step was once `pip install "pytest>=8,<9"` and nothing
      # else, which is exactly why the first carved commit failed the required
      # check with `No module named 'yaml'`: the runner was there and the
      # package's own dependencies never were. The extras are read from
      # `pyproject.toml`, so every range is declared once.
      #
      # `.[runtime,test]`, R1Q8 (a)'s install: the `runtime` extra is what the
      # DB-backed half of `tests_runtime/` imports. (The `test` extra names
      # `opendox[runtime]` too, because #1144's F9.1 installs `.[test]` alone
      # and must get a whole suite from it; naming both here says what this
      # job needs rather than relying on that.)
      #
      # `-c` LOCKS THE RESOLVED VERSIONS. Without it this required check
      # installs whatever the index resolves to on the day it runs, so the same
      # commit tested twice is two different programs and a dependency can
      # change under a green light (SonarCloud `githubactions:S8544`, advisory
      # here, registered on openDox-code#26 and built in the follow-up).
      #
      # `--only-binary :all:` — SonarCloud `githubactions:S8541`, and it is a
      # real hardening rather than a suppression: without it pip is allowed to
      # build a dependency from an sdist, which runs that project's `setup.py`
      # inside this job. Every package in the `runtime` extra publishes wheels
      # for cpython 3.12 on linux (`psycopg[binary]` is asked for by name
      # precisely so libpq never has to be built), so the flag costs nothing.
      # The local editable project itself is exempt from the flag, which is why
      # `-e .` still works.
      #
      # A FOLDED SCALAR (`>-`) AND NOT A PLAIN ONE, and it is not a style
      # choice: `--only-binary :all: -e` contains `: `, and in a plain YAML
      # scalar a colon followed by a space is a mapping indicator. Written
      # plainly the file does not parse — `yaml.scanner.ScannerError: mapping
      # values are not allowed here` — and GitHub Actions then runs NO job from
      # it at all (`tests_runtime/test_deploy_shape.py` parses this file for
      # exactly that reason).
      - name: install the package with the runtime and test extras
        run: >-
          python -m pip install --only-binary :all:
          -c constraints-cpython312-linux.txt
          -e ".[runtime,test]"

      # ONE INVOCATION, ONE REPORT. The whole suite is one `pytest` run, so it
      # writes one JUnit report and `Pin the triple` below reads that one.
      - name: pytest
        env:
          # The same throwaway credential as the service block above, spelled
          # as a DSN, and marked the same way and on the same precedent:
          # `xFactory-Hermes-Install/.github/workflows/ci.yml` marks BOTH
          # halves, its Postgres password and its DSN. Marking only the first
          # leaves the secret scanner pointing at the second. (The marker is
          # written only at the end of the line below; a prose comment that
          # spells it is itself read as a malformed suppression.)
          OPENDOX_TEST_DATABASE_URL: postgresql://opendox:opendox@127.0.0.1:5432/opendox # NOSONAR
        run: python -m pytest -q --junitxml=pytest-report.xml

      # -----------------------------------------------------------------------
      # THE PINNED TRIPLE — `split-opendox-two-layer-product` § 5.4 FLOOR
      # PART 2, clause (d), THIS LEG'S HALF.
      #
      # The clause, verbatim (openxFactory `openspec/changes/
      # split-opendox-two-layer-product/tasks.md:2768-2775`):
      #
      #   "(d) PINNED BY TEST at each destination and in `openxFactory` ...
      #    the way `pytest-suite.yml` already pins this repository's
      #    collection triple - SKIPPED exactly, SELECTED and PASSED as
      #    FLOORS, failures and errors zero. Per destination, never as one
      #    cross-repository equality: an equality pin on a sum goes RED on
      #    merge refs that add tests for reasons the candidate cannot fix,
      #    which is the deadlock class `pytest-suite.yml` already refuses by
      #    name."
      #
      # So this pin is openDox-code's OWN triple and never a sum across the
      # three repositories.
      #
      # SELECTED is the JUnit `tests` attribute; PASSED is selected minus
      # skipped, failures and errors — read from the XML rather than from the
      # `-q` summary line, because that summary is a human line whose format
      # has changed before.
      #
      # THE NUMBERS ARE CI'S OWN, NOT A DEVELOPER MACHINE'S. Self-skip guards
      # stand down on a runner and resolve in a developer worktree, so a
      # locally measured SKIPPED is knowably the wrong number; each re-pin
      # below names the run it was read from.
      #
      # WHAT MOVES THEM, now that no list is kept here: any test added to or
      # removed from `tests/` or `tests_runtime/`, a skip that starts or stops
      # firing on this runner, and an entry in the root conftest's
      # `collect_ignore` — which is empty (plan 034 T035) and would LOWER
      # SELECTED, so the floor refuses it. Adding a test raises SELECTED and
      # PASSED; floors permit a rise, and the commit that adds it should raise
      # them by as many, WITH the reason, so the margin stays at its declared
      # size (below). Removing one lowers them. The margin absorbs up to three,
      # which is the trade stated below; past that the floor refuses: find the
      # tests, do not lower the floor.
      #
      # AND SKIPPED IS THE LOAD-BEARING NUMBER, pinned EXACTLY. A file that
      # quietly turns into skips is precisely what an exact pin catches and a
      # floor cannot, which is why this one is `==` and the other two are `>=`.
      # If a change makes it move, move the pin WITH the reason in the commit
      # message — never relax the comparison.
      #
      # THE CASES THAT HOLD THIS STEP are `tests/test_triple_pin.py`'s. They
      # extract this step's `run` and `env` and execute them over reports they
      # write themselves, so what they test is what the runner executes.
      - name: Pin the triple
        shell: bash
        env:
          # FLOORS — they RISE with the tests. They are lowered only with the
          # reason in the commit message, as plan 034 T037's move at the end of
          # this block is.
          #
          # RE-PINNED BY plan 034 T036 for the whole suite, which this job now
          # runs as one invocation. READ FROM CI, on run 36333569456 (job
          # 108660020012), over `56d51edc`: `main` `80acead1`, where T035 had
          # emptied `collect_ignore`, merged into this change. That run printed
          # `triple: selected=2459 passed=2446 skipped=13 failures=0
          # errors=0`, and pytest's own line was `2446 passed, 13 skipped`.
          #
          # NOT DERIVED. A local replica of this job at `main` `71b631bc` plus
          # this change read 2170 / 2157 / 13 before T035 landed, and T035's
          # 289 cases (`tests/` went from 1571 to 1860 passed) account for the
          # whole difference. That is a check on the reading, not its source.
          #
          # RAISED ONCE MORE for the twelve cases Copilot's review of this pull
          # request led to (`tests_runtime/test_deploy_shape.py::
          # test_the_run_count_sees_every_shell_separator`). Read from run
          # 36334996991 (job 108664042314) over `485e085a`: `triple:
          # selected=2471 passed=2458 skipped=13 failures=0 errors=0`, which
          # printed `margin 12` against the floors above. 2459 + 12 is a check
          # on that reading, not its source.
          #
          # AND AGAIN for the ten cases the next two reviews led to: the same
          # parametrized case now also drives the count over runs hidden inside
          # a wrapper (`env`, `timeout`, `uv run`, `xargs`, `sh -c`, `bash -c`).
          # Read from run 36337919108 (job 108672216615) over `db3e8a4f`:
          # `triple: selected=2481 passed=2468 skipped=13 failures=0
          # errors=0`, `margin 10`. 2471 + 10 is a check, not the source.
          #
          # MOVED BY plan 034 T037, for two reasons. Requirement 9.4 reads
          # "Restore the margin, and stop the skips carrying the gap", and
          # FR-006 reads "The margins SHALL be restored, with no skip carrying
          # the gap".
          #
          # 1. THE TWO SKIPS THAT MIRRORED openXdox's GAP ARE GONE. Both were
          #    in `tests/test_binding_stylesheets.py`, and both needed
          #    openXdox's six contributed modules or its sheets, which this leg
          #    never ships. Their both-legs halves go to the composition
          #    (openXdox-code's `tests/integration/`, T042). The half this leg
          #    can prove alone stays, as a passing case. With the two cases
          #    that served only them, four cases leave. Two arrive: that
          #    passing half, and a case that drives the own-bundle exclusion
          #    over an assembled bundle. So SELECTED -2, PASSED 0 and
          #    SKIPPED -2. The file's closing comment lists each case with its
          #    destination.
          # 2. THE MARGIN IS RESTORED. The floors sit THREE below CI's reading
          #    instead of on it. That is the reference implementation's rule,
          #    openxFactory `pytest-suite.yml`: "three below the lower of the
          #    two greens". Read from two runs of one tree, `8c03966a`: run
          #    36339183129 (job 108675776512) and its re-run (job
          #    108676424965). Both printed `triple: selected=2478 passed=2467
          #    skipped=11 failures=0 errors=0`, so no jitter was measured, and
          #    three below the lower of the two is 2475 / 2464. A local
          #    replica read the same, which is a check, not the source.
          #
          #    RAISED BY ONE for the case Copilot's review of #55 asked for,
          #    which drives the own-bundle exclusion over an assembled bundle.
          #    Read the same way, from two runs of `3dd66679`: run 36340595113
          #    (job 108679779797) and its re-run (job 108680366270). Both
          #    printed `triple: selected=2479 passed=2468 skipped=11
          #    failures=0 errors=0`, so three below the lower of the two is
          #    2476 / 2465.
          #
          #    THE TRADE, stated as the reference states it. A loss of up to
          #    three collected tests does not red on the floors alone. It still
          #    reds on the exact SKIPPED pin if the lost tests became skips, and
          #    on failures or errors if they failed. So the only shape the
          #    margin lets through is up to three tests that stop being
          #    COLLECTED at all, and a lost file is dozens of tests, never
          #    three.
          #
          # RE-PINNED BY plan 034 T082 (Copilot at openDox-code#76 947411fd,
          # r4170556888). Since T037, the cases added by later changes had
          # left these floors where they were, so the declared three-test
          # margin had grown to several hundred. T082 adds 34 cases and
          # re-pins by the rule above: three below the lower of two greens
          # of one tree. The tree is `a25606bb`, T082 after merging `main`
          # at `0116293a` (T084, T103 and T102 included). Read from run
          # 37152269851: attempt 1 (job 111288409713) and its re-run (job
          # 111296677742). Both printed `triple: selected=3980 passed=3969
          # skipped=11 failures=0 errors=0`, so no jitter was measured, and
          # three below is 3977 / 3966. A local run of the same tree read
          # 3803 passed and 177 skipped (3980 selected), with no PostgreSQL
          # service, so the runtime cases skip there. That is a check, not
          # the source.
          MIN_SELECTED: "3977"
          MIN_PASSED: "3966"
          # EXACT — the load-bearing number. Moves only with its reason.
          #
          # HELD AT 11 by plan 034 T082. While T082 was stacked ahead of T084
          # this pin read 16: five of `tests/test_chat_model_configuration.py`'s
          # 16.5 cases ran as strict xfails naming T084, and JUnit writes an
          # xfail as a skip. T084 landed (openDox-code#77, `e49b17c3`), T082
          # merged `main` and removed the five markers in that merge, and the
          # five now pass. So T082 adds no skip.
          EXPECT_SKIPPED: "11"
        run: |
          python3 - <<'PY' > triple.env
          import xml.etree.ElementTree as ET, pathlib
          REPORTS = ("pytest-report.xml",)
          tot = {"tests": 0, "skipped": 0, "failures": 0, "errors": 0}
          missing = []
          for name in REPORTS:
              f = pathlib.Path(name)
              if not f.exists():
                  missing.append(name)
                  continue
              root = ET.parse(f).getroot()
              suites = root.iter("testsuite") if root.tag == "testsuites" else [root]
              for ts in suites:
                  for k in tot:
                      tot[k] += int(ts.get(k, 0))
          if missing:
              # A REPORT THAT DID NOT APPEAR IS A REFUSAL, NOT A SMALLER SUM.
              # With no report there is nothing to count, and a zero read from
              # nothing is not a measurement.
              print("MISSING=" + ",".join(missing))
          print(f"SELECTED={tot['tests']}")
          print(f"SKIPPED={tot['skipped']}")
          print(f"FAILURES={tot['failures']}")
          print(f"ERRORS={tot['errors']}")
          print(f"PASSED={tot['tests'] - tot['skipped'] - tot['failures'] - tot['errors']}")
          PY
          . ./triple.env
          if [ -n "${MISSING:-}" ]; then
            echo "::error::JUnit report missing: $MISSING — a report that did not appear is a refusal, not a smaller sum. The test run did not write it, so there is no triple to pin"
            exit 1
          fi
          echo "triple: selected=$SELECTED passed=$PASSED skipped=$SKIPPED failures=$FAILURES errors=$ERRORS"
          echo "pins:   selected>=$MIN_SELECTED (margin $((SELECTED - MIN_SELECTED))) passed>=$MIN_PASSED (margin $((PASSED - MIN_PASSED))) skipped==$EXPECT_SKIPPED"
          rc=0
          [ "$SELECTED" -ge "$MIN_SELECTED" ] || { echo "::error::selected $SELECTED is BELOW the floor $MIN_SELECTED — tests stopped being collected. Find them; do not lower the floor"; rc=1; }
          [ "$PASSED" -ge "$MIN_PASSED" ] || { echo "::error::passed $PASSED is BELOW the floor $MIN_PASSED — find the tests that stopped passing or stopped being collected; do not lower the floor"; rc=1; }
          [ "$SKIPPED" = "$EXPECT_SKIPPED" ] || { echo "::error::skipped $SKIPPED, pinned exactly $EXPECT_SKIPPED — a file or directory that silently turned into skips is exactly what this pin exists to catch. If the change is intended, move the pin WITH the reason. The causes, and this list is not closed: (1) a module- or test-level skip that FIRED on this runner where it did not before — the conformance-corpus suite skips its git-backed cases when git is absent, a case may skip on a platform without /proc/self/fd, and the triple-pin suite skips where 'bash' or 'python3' is not on PATH; (2) a new case that ships already-skipped; (3) a dependency the runner resolved differently, where an importorskip is the gate. A database-backed case is NOT among them: under CI those fail rather than skip"; rc=1; }
          [ "$FAILURES" = "0" ] || { echo "::error::failures $FAILURES, clause (d) requires zero"; rc=1; }
          [ "$ERRORS" = "0" ] || { echo "::error::errors $ERRORS, clause (d) requires zero"; rc=1; }
          exit $rc

  # ---------------------------------------------------------------------------
  # AT-R1, THE HTTP HALF — plan 034 T095 (FR-011's HTTP half; openxFactory
  # `specs/034-opendox-standalone-operation/spec.md` § "AT-R1"). Release 1's
  # acceptance: on a clean machine with only openDox installed, a plain git
  # repository opens, and the wheel, the radar lens and the chat pane are
  # served, with chat's "no model configured" state.
  #
  # ITS OWN JOB, AND WITH NO DATABASE SERVICE, because the harness ASSERTS a
  # clean machine: nothing answers on PostgreSQL's port or socket, and no DSN
  # is set. The `validate` job's PostgreSQL service (T036) would break that
  # precondition, so the two cannot share a job.
  #
  # NOT A PYTEST RUN. `acceptance/at_r1_http.py` sits outside `tests/` and
  # `tests_runtime/`, so `testpaths` never collects it and #1144's F9.1 is
  # unchanged. It installs `opendox[local]` into a fresh venv of its own,
  # from this checkout and through the dependency lock, runs the documented
  # `opendox generate-and-open --local …` over two plain repositories, checks
  # what the server answers, stops it, and asserts that no bundled PostgreSQL
  # process is left. It exits non-zero on the first failed assertion, naming
  # it. So this job installs nothing itself, and the one `pip install` step
  # in this file stays the `validate` job's.
  #
  # NOT A REQUIRED CHECK. Making it one is a ruleset change for the
  # repository's owner (`docs/branch-protection.md`); this file cannot.
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: AT-R1, the HTTP half
        run: python3 acceptance/at_r1_http.py
