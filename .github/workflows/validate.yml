  # -------------------------------------------------------------------------
  # THE DB-BACKED HALF, IN ITS OWN JOB — `split-opendox-two-layer-product`
  # § 3.5/§ 3.6.
  #
  # A NEW JOB AND NOT MORE STEPS ABOVE, deliberately. `validate` is this
  # repository's one REQUIRED status check (openDox-code#2, "Enforce validate
  # as a required status check"), and a required check that needs a database
  # service and a web framework to install is a required check that goes red
  # for an outage. So the required job stays hermetic and this one carries the
  # dependencies: a `postgres:16` service on the Hermes install's own CI shape
  # (`xFactory-Hermes-Install/.github/workflows/ci.yml`), and
  # `pip install -e ".[runtime,test]"`.
  #
  # IT IS NOT A REQUIRED CHECK AND THIS BLOCK IS WHERE THAT IS RECORDED.
  # Making it one is a repository SETTING (`docs/branch-protection.md`), not a
  # file, and it is a separate act with a separate owner — named here so the
  # gap is visible rather than assumed.
  #
  # AND THAT IS RULED, not deferred by this act's own judgment:
  # RULED openxFactory#656 comment 5701772032 (Brett Heap, 2026-09-16, by interactive multi-choice)
  # answers Q-R3 — this job is ADVISORY now and becomes required in a separate
  # DECLARED act. So the gap above is a scheduled act with an owner, and the
  # required check stays hermetic in the meantime.
  #
  # WITHOUT `--noconftest`, because this is the job `tests_runtime/conftest.py`
  # exists for: the per-test schema, the in-fixture RSA key pair and the token
  # minter. Where `OPENDOX_TEST_DATABASE_URL` is unreachable a DEVELOPER's tree
  # skips with the reason printed, and HERE IT FAILS: `CI` is set, and pytest
  # exits 0 when every collected case is skipped, so a run whose `postgres:16`
  # service failed to start would otherwise report green having made no
  # database-backed assertion at all (`conftest._skip_or_fail`; Copilot review
  # of openDox-code#25, round 5). This job supplies the service, so its absence
  # here is this job's own defect and is reported as one.
  runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: opendox
          # A throwaway CI credential for a service container reachable only
          # from this job's own network namespace, torn down with the job. No
          # real secret is ever written into a workflow file — the runtime's
          # own DSNs are Secret references everywhere they appear
          # (`deploy/kubernetes/base/`), and `tests_runtime/test_deploy_shape.py`
          # refuses a committed credential value. Marked at the end of the line
          # below on the estate's own precedent:
          # `xFactory-Hermes-Install/.github/workflows/ci.yml` marks its
          # identical Postgres password the same way.
          POSTGRES_PASSWORD: opendox # NOSONAR # NOSONAR
          POSTGRES_DB: opendox
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # `--only-binary :all:` — SonarCloud `githubactions:S8541`, and it is a
      # real hardening rather than a suppression: without it pip is allowed to
      # build a dependency from an sdist, which runs that project's `setup.py`
      # inside this job. Every package in the `runtime` extra publishes wheels
      # for cpython 3.12 on linux (`psycopg[binary]` is asked for by name
      # precisely so libpq never has to be built), so the flag costs nothing —
      # measured in a clean venv on 2026-09-16: `pip install --only-binary :all:
      # -e ".[runtime,test]"` resolves and installs, and `import fastapi,
      # psycopg, jwt, httpx, uvicorn, opendox.runtime` succeeds. The local
      # editable project itself is exempt from the flag, which is why `-e .`
      # still works.
      # A FOLDED SCALAR (`>-`) AND NOT A PLAIN ONE, and it is not a style
      # choice: `--only-binary :all: -e` contains `: `, and in a plain YAML
      # scalar a colon followed by a space is a mapping indicator. Written
      # plainly the file does not parse — `yaml.scanner.ScannerError: mapping
      # values are not allowed here` — and GitHub Actions then runs NO job from
      # it at all, which is exactly what the previous head of this branch did:
      # only SonarCloud reported, and `validate` and `runtime` never started.
      # The step above uses the same form for the same reason.
      - name: install the package with the runtime and test extras
        run: >-
          python -m pip install --only-binary :all: -e ".[runtime,test]"

      - name: pytest (runtime, database-backed)
        env:
          # The same throwaway credential as the service block above, spelled
          # as a DSN, and marked the same way and on the same precedent:
          # `xFactory-Hermes-Install/.github/workflows/ci.yml` marks BOTH
          # halves, its Postgres password and its DSN. Marking only the first
          # leaves the secret scanner pointing at the second, which is what
          # this act's first pass did. (The marker is written only at the end
          # of the line below; a prose comment that spells it is itself read as
          # a malformed suppression.)
          OPENDOX_TEST_DATABASE_URL: postgresql://opendox:opendox@127.0.0.1:5432/opendox # NOSONAR
        run: python -m pytest -q tests_runtime/
