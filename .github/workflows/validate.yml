name: validate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # INSTALL THE PACKAGE, not just the runner — RULED Q-L2 (openxFactory#656,
      # 2026-09-10). This step was `pip install "pytest>=8,<9"` and nothing
      # else, which is exactly why the first carved commit failed the required
      # check with `No module named 'yaml'`: the runner was there and the
      # package's own dependencies never were. `-e .[test]` installs both from
      # `pyproject.toml`, so the pytest range round 1 chose — `pytest>=8,<9`,
      # unchanged — is declared once, in the `test` extra, and read from here
      # rather than copied here.
      - name: install the package and its test extra
        run: python -m pip install -e ".[test]"

      # RULED Q-L5 (b′), opensoft/openxFactory#656, 2026-09-10: until the
      # BUILD arc (split-opendox § 3.5/3.6) inverts the openDox → openXdox
      # dependency, validate runs only the scaffold's shape assertions; the
      # carved tests arrive byte-identical and return to this workflow when
      # the BUILD arc lands. The root conftest's collect_ignore list (round 2)
      # remains the record of what was already known.
      #
      # THAT PARAGRAPH IS THE PRE-S8 BASELINE AND IS KEPT AS ONE (Copilot
      # review of #23): § 3.4 slice S8, at the end of this block, lifts the
      # narrowing FOR THE WEB SUITES — the half of Q-L5 (b′) the note's § 5 S8
      # row scopes to this slice — so the sentence above states what this
      # workflow ran BEFORE that lift, not what it runs now. The other half
      # stands: what the tree still cannot collect waits on the BUILD arc, and
      # the closing paragraphs of this block measure exactly what that is.
      #
      # BUILD SLICE 2 adds `tests/test_consumer_reach.py` beside it, and it is
      # not a carved suite returning early: it asserts the DIRECTION — that
      # openDox's own modules import with `openxdox` unimportable — which is
      # the property Q-L5 (b′) is waiting on. Both files are `--noconftest`
      # safe and neither needs the consumer installed, which is the point.
      #
      # § 4.3 adds `tests/test_profile_registration.py` on the same footing
      # (RULED ASK-2 option (2), openxFactory#656 comment 5628886636): it
      # asserts the COMPOSITION POINT — that `profile_openxfactory` resolves at
      # first attribute access through a registration the host makes, and
      # refuses naming that call when no host made one — and it is the only
      # place the ruled contract is executed rather than described. It is
      # `--noconftest` safe and needs no consumer, for the same reason and by
      # the same means as its two neighbours.
      #
      # § 3.4 slice S1 (`docs/front-end-package-boundary.md`, openDox-spec #8
      # → a44ac06d; RULED opensoft/openxFactory#656 comment 5642758731) adds
      # `tests/test_web_boundary.py` on the same footing: it declares the
      # `src/opendox/web/` census (`tests/fixtures/web_boundary_census.yaml`)
      # and asserts the four things that hold the front-end package boundary
      # — the census is complete, no file outside the gate loop names a
      # route another column declares, every relative import resolves and
      # stays in its class, and no stage-named file carries a governance
      # literal. Three of the four are marked `xfail(strict=True)` for
      # defects slices S2–S7 close (RULED, START S1–S3 NOW, same comment) —
      # `strict=True` is what keeps this addition from putting the required
      # check red for the length of that arc, and what turns it red the
      # moment a later slice closes a defect without removing that slice's
      # marker. `--noconftest` safe: it parses the tree and the declared
      # YAML census, and imports no view module (they are JavaScript) and no
      # `opendox` submodule.
      #
      # `docs/front-end-package-boundary.md` § 3.4 slice S2 (RULED Q5,
      # openxFactory#656 comment 5642758731) adds
      # `tests/test_intent_binding_shape.py` on the same footing again: a
      # text/regex SHAPE assertion over dispose.js, wheel.js and the new
      # intent-binding.js (there is no JS parser in this leg's dependency
      # set, and the note's own § 4.5 test is written to the same
      # constraint) proving the two views no longer name the absent
      # `views/intent-feed.js` (RULED OQ-F `not_moved`) in a static import.
      # `--noconftest` safe and needs no consumer — it reads three files as
      # text and nothing else. The BEHAVIOURAL probe of the same seam
      # (`tests/test_intent_binding_dom.py`, node-driven) STAYED off this
      # list at S2, on the same footing as its siblings
      # `test_intent_tray_dom.py` / `test_wheel_verbs_dom.py`: it is a DOM
      # probe of a `web/` view, and un-narrowing that class of test was
      # slice S8's job, not S2's. **S8 has since done that job for this one
      # file** — `tests/test_intent_binding_dom.py` is named in the list below
      # — and the two siblings are NOT on it because THEY NO LONGER EXIST
      # HERE. RULED `openxFactory#656` comment 5656343213 (Brett Heap,
      # 2026-09-13, citing RULED OQ-F) RETIRED both at this leg.
      #
      # NEITHER CAN RUN HERE, AND THE TWO DO NOT FAIL FOR QUITE THE SAME
      # REASON -- measured in the two files themselves before they were
      # deleted, because an earlier draft of this paragraph said both DROVE
      # `views/intent-feed.js` and only one did (Copilot review of
      # openDox-code#24). The TRAY suite drove it: its own header reads "DOM
      # behaviour of the HOSTED dispose tray and the intent-feed overlay", it
      # imports `emitIntent` from that module, and it passes `intent:`
      # payloads throughout. The WHEEL suite did NOT, and said so in its own
      # words -- "`intent-feed.js` rides along because dispose.js imports it
      # ... This probe drives the LOCAL path only -- no `opts.intent` is ever
      # passed" -- so it copied the feed to make a static import resolve and
      # nothing more. Saying both drove it OVERSTATED the coverage this
      # retirement gives up, which is the one thing a retirement's record
      # must not do.
      #
      # WHAT THEY SHARE IS THE COPY LOOP AND WHAT IT CANNOT FIND HERE.
      # `views/intent-feed.js` is RULED OQ-F `not_moved`: it STAYED at
      # openxFactory and arrived at NEITHER leg. And `views/dispose.js`,
      # which BOTH suites mount, moved to openXdox-code at § 3.4 slice S5 and
      # is not at this leg either (`find . -name dispose.js` is empty here and
      # finds `src/openxdox/web/views/dispose.js` there). So openxFactory's
      # carve manifest carries the `retired:` block and this commit carries
      # the deletion. S8's own reason for
      # omitting them was right for the question S8 could ask — measured at
      # its head, `test_intent_tray_dom.py` 23 failed and
      # `test_wheel_verbs_dom.py` 8 failed, so naming either would have put the
      # required check red for another act's defect — and the ruling answers a
      # DIFFERENT question: not "should the list name them" but "should they be
      # here at all". THERE IS NO NARROWED SIBLING LEFT TO UN-NARROW HERE.
      # This paragraph records S2's state, then S8's, then the ruling's; the
      # list below records today's.
      #
      # TWO SENTENCES ELSEWHERE IN THE TREE STILL NAME THE RETIRED SUITES, AND
      # THEY STAY — recorded here so the residue is DECLARED rather than found.
      # `tests/test_account_menu_dom.py`:4 sends a reader to
      # `test_wheel_verbs_dom.py` for the DOM shim, and
      # `tests/test_doxbench_tile_verbs.py`:19 names it as an instrument in
      # use. Both files are `moved_with_declared_edit` carve rows whose ONLY
      # declared edit is `path constants`, at carve line 30 and carve line 34
      # respectively, and at a leg every line on which an arrived file differs
      # from its carve blob has to fall in one of RULING OQ-1's three CLOSED
      # classes — `import rewrites`, `path constants`, `adapter calls`. A
      # comment naming a retired sibling is none of the three. The repair was
      # made and then WITHDRAWN on that ground (`ebf1425`, restored at
      # `d9b7f0f4`), and the withdrawal is not a guess about the verifier:
      # `scripts/verify-carve-arrival.py --phase B`, run against a destination
      # carrying only that one edit, refuses it by name —
      # "arrival-undeclared-edit — tests/test_account_menu_dom.py was edited at
      # carve-commit line(s) [4] which the row … does not declare; it declares
      # [30] under class(es) path constants" — and the same for line [19] of
      # the other. Filing either under a class it does not belong to would put
      # a false description in the floor's own record to make a comment read
      # better (openxFactory `docs/opendox-cutover-runbook.md` § 5.8 step 4:
      # "AND THE REPAIR STOPS AT A CARVED FILE"). So the repair covers only
      # the prose THIS LEG OWNS — this workflow, and the files the leg created
      # under a declared admission. What would move those two sentences: a
      # ruling widening OQ-1's class vocabulary, or some other act amending
      # those rows for a reason the vocabulary already covers.
      #
      # `tests/test_account_menu_dom.py` is now ON the list below, so the
      # required check RUNS the file whose line 4 still names a retired
      # sibling. That changes nothing: the sentence is a comment, and the
      # reason it is unrepaired is unchanged — the file is a
      # `moved_with_declared_edit` carve row whose only declared edit is
      # `path constants` at carve line 30, and a comment naming a retired
      # sibling is none of RULING OQ-1's three CLOSED classes. Its companion
      # `tests/test_doxbench_tile_verbs.py` is NOT on the list, so that
      # sentence is not executed by anything either way.
      #
      # § 3.4 SLICE S3 adds `tests/test_view_registry.py`, on exactly the same
      # footing as its three neighbours and for the same reason: it asserts a
      # SEAM — that a contributed panel is collected, refused or absent by the
      # rules `route_extension.collect_bindings` already holds for routes — and
      # it is the only place slice S3's ruled contract is executed rather than
      # described. `--noconftest` safe and needs no consumer: the Python half
      # imports `opendox.view_extension` alone, and the JavaScript half drives
      # the real `views/view_extension.js` under the `node` the runner already
      # has (skipped, never failed, where node is absent). S3's registry test
      # also carries its own `package.json` fix (opensoft/openDox-code#14,
      # Copilot re-review): the repository ships no other Node tooling, so
      # `type: module` is declared explicitly rather than left to Node's
      # default-on `--experimental-detect-module` heuristic.
      # § 3.4 SLICE S4 adds `tests/test_split_route_tails.py`, on the same
      # footing as its five neighbours. S4 splits the three RULED SPLIT files
      # (RULED Q3, `#656` comment `5642758731`: "a route constant travels with
      # the binding that calls it, never with the model that happens to declare
      # it"), and `tests/test_web_boundary.py` alone cannot tell that slice
      # apart from a slice that DELETED the thirteen route constants: its
      # census assertion measures that no file outside class B names another
      # column's route, which is equally true of a bundle whose gate verbs no
      # longer work. This file measures the other half — each constant declared
      # in the class-B file that CALLS it, the binding entries in `app.js` and
      # the modules they name declaring the same routes, no class-A/C file
      # reaching the three new modules through a static import, and the three
      # modules actually performing their verbs. `--noconftest` safe and needs
      # no consumer: it reads bundle files as text and drives the real ones
      # under the `node` the runner already has (skipped, never failed, where
      # node is absent), exactly as `tests/test_view_registry.py` does.
      #
      # § 3.4 SLICE S6 adds `tests/test_source_core_arm.py`, and it is the
      # slice's only running proof. RULED Q4 (openxFactory#656 comment
      # 5642758731) makes the read-only `/source` pass-through openDox's OWN
      # fixed core arm rather than a binding contributed by the layer that pins
      # openDox; the assertions that already covered the route drive a whole
      # server over a socket and cannot run at either leg (§ 1.2(d), and this
      # narrowing itself), so a source-level SHAPE assertion is what is
      # available until S8 lifts them — and it is not nothing: the route's
      # ownership, its exact-before-prefix dispatch order, its single
      # containment authority, its two content types and its three distinct
      # refusals are all properties of the text. `--noconftest` safe: it parses
      # `src/opendox/serve.py` and reads the live `opendox.consumer_reach`
      # (whose whole point is that importing it resolves nothing), and it
      # imports `opendox.serve` nowhere — that module still cannot be imported
      # at either leg, which is precisely what `tests/test_consumer_reach.py`'s
      # `STILL_REACHING` records. It carries NO `xfail`: nothing it measures is
      # a defect awaiting a later slice.
      # § 3.4 SLICE S5 adds `tests/test_gate_loop_contributed.py`, on the same
      # footing as its six neighbours. S5 is "contribute the gate loop": the six
      # class-B modules leave this bundle for openXdox-code's package data and
      # arrive back as contributed `ViewBinding`s (RULED Q1-Q12,
      # openxFactory#656 comments 5648044785 / 5648049748 / 5648065587, Brett
      # Heap, 2026-09-12). `tests/test_web_boundary.py` measures the BOUNDARY
      # and would be just as green if the gate loop had been DELETED; this file
      # measures the other half — the seam the modules left through, the
      # declared namespace bounding what the shell may reach, `requires`
      # evaluated, the generic mount pass, `ViewBindingError` surfaced
      # separately, and the slice's own success test: that a student install
      # comes up with no gate bar, no dispose tray, no session verbs and no 404.
      #
      # `--noconftest` safe and needs no consumer: it imports
      # `opendox.view_extension` alone, reads bundle files as text, and drives
      # the real `views/view_extension.js` under the `node` the runner already
      # has (skipped, never failed, where node is absent), exactly as
      # `tests/test_view_registry.py` and `tests/test_split_route_tails.py` do.
      # § 3.4 SLICE S7 adds `tests/test_display_facet.py`, on the same footing as
      # its seven neighbours. S7 is "parameterize class C": every governance word
      # in the fourteen class-C files and the four declared class-A tails becomes
      # a read of the registered domain's DISPLAY facet BY ROLE (RULED Q1/Q2/Q7,
      # openxFactory#656 comment `5648049748`; openXdox-spec
      # `docs/domain-profile-design-note.md` § 6's rule and its reason).
      # `tests/test_web_boundary.py`'s assertion 4 measures the BOUNDARY — that
      # no governance word survives as a literal — and would be just as green if
      # every word had been DELETED. This file measures the other half: that the
      # words come from somewhere, that the somewhere is the ONE registered
      # profile, that the two halves of the facet (`src/opendox/display_profile.py`
      # and `src/opendox/web/views/display.js`) declare the same roles in the same
      # order and the same neutral words, that a declared facet is read or refused
      # rather than guessed at, and — the slice's own success test — that a
      # STUDENT INSTALL, whose profile declares no facet, renders openDox's own
      # neutral vocabulary and no word of openxFactory's anywhere in the payload.
      # § 4.3 point 5 names the failure it guards: "a fallback to TODAY'S WORDS is
      # how the literals survive the refactor invisibly."
      #
      # `--noconftest` safe and needs no consumer: it imports `opendox`'s own
      # `display_profile` alone, reads bundle files as text, and drives the real
      # `views/display.js`, `views/model.js`, `views/wheel-model.js` and
      # `views/staging-workbench-model.js` under the `node` the runner already has
      # (skipped, never failed, where node is absent), exactly as
      # `tests/test_view_registry.py` and `tests/test_split_route_tails.py` do.
      # § 3.4 SLICE S8 UN-NARROWS THIS LIST FOR THE WEB SUITES, which is the
      # half of RULED Q-L5 (b′) this slice was scoped to lift: the note's § 5
      # S8 row says the narrowings "lift FOR THE WEB SUITES", and the S2
      # paragraph above says of the DOM probes that "un-narrowing THAT CLASS OF
      # TEST is slice S8's job, not S2's". Seventeen carved suites join the ten
      # shape assertions here — 283 tests become 694 — and every one of them was
      # run file-by-file under this exact invocation before it was named
      # (openDox-code `build/s8-receive-web-tests`, measured 2026-09-13 at
      # python 3.12.3 / pytest 8.4.2). THE FIGURE MOVED TWICE AND BOTH STEPS ARE
      # THE BASE'S, not this list's — the list has been the same 27 files
      # throughout. It was 683 when this block was written; +8 are
      # `tests/test_display_facet.py`'s own, which grew in the S7 BASE this
      # branch merged (openDox-code#21 `706b533`), giving 691; +3 more are
      # `tests/test_gate_loop_contributed.py`'s, which grew by 128 lines when
      # that same merge-forward brought `origin/main` in — 31 test functions
      # in it at `a7b7ac28`, 34 now — giving 694 at the merged head. A figure
      # that moves with the base is stated with the base that produced it.
      #
      # WHAT THIS LIST STILL IS NOT: `python -m pytest -q` over the tree. That
      # is measured and it is NOT S8's to deliver — with the root conftest in
      # play the tree is 1188 errors and 0 passed, and 1126 of those are ONE
      # line, `src/opendox/serve.py:192`'s `from ideation_dashboard import
      # serve_openxfactory_lanes`, reached from the autouse
      # `declared_human_console` fixture (`tests/session_fixtures.py:413` ->
      # `opendox.cli` -> `opendox.serve`) that `tests/conftest.py` re-exports for
      # the whole tree. `tests/test_consumer_reach.py`'s `STILL_REACHING` records
      # that reach BY NAME and asserts it still fails — "whose rewrite target
      # exists at neither carve destination" — and RULED Q-L5 (b′)'s own sentence
      # at the head of this block says the rest of the narrowing stands "until
      # the BUILD arc (split-opendox § 3.5/3.6) inverts the openDox -> openXdox
      # dependency". So the remaining narrowing is the BUILD arc's to lift, on
      # the record, rather than bought here with a `--continue-on-collection-
      # errors` or an ignore list.
      #
      # SIX SUITES S8 REPAIRED TO GET HERE (Copilot review of #23, accurate —
      # this block said four and omitted two), all of them the same defect
      # class: a PATH CONSTANT the carve's `import rewrites` edit never
      # rewrote, each declared on its own row in the paired openxFactory
      # annotation. Measured file-by-file under this workflow's own
      # invocation, before and after:
      #
      #   tests/test_outline_model.py               48 failed  -> 47 passed, 1
      #       `parents[2]`, the openDox-code #19 conftest-depth defect one file
      #       over. The one left needs `doc_health`, openxFactory-only.
      #   tests/test_doxbench_view.py               73 errors  -> 124 passed
      #       `tests/ideation-dashboard/fixtures/`, the pre-carve location.
      #   tests/test_doxbench_knowledge.py          21 failed  -> 56 passed
      #   tests/test_doxbench_document_abstract.py   2 failed  -> 54 passed
      #   tests/test_doxbench_memory_gateway.py     12 failed  -> 3 failed
      #       `scripts/ideation_dashboard/<module>.py`, the pre-carve module
      #       path; the three left read openxFactory's own `openspec/` tree.
      #   tests/test_bullseye_widget.py              5 failed  -> 4 failed
      #       the same pre-carve read, for `serve.py`.
      #
      # TWO OF THE SIX ARE NAMED IN THE LIST BELOW and FOUR ARE NOT (Copilot
      # review of this head, accurate — this block said three and three, and
      # the list below names two). The two named are the two the repair leaves
      # wholly green: `test_doxbench_knowledge.py` and
      # `test_doxbench_document_abstract.py`. The four omitted are
      # `test_outline_model.py`, `test_doxbench_memory_gateway.py`,
      # `test_bullseye_widget.py` and `test_doxbench_view.py`, and the reason
      # for each is measured rather than asserted. The first three each keep a
      # residue this slice does not own (`doc_health` and openxFactory's
      # `openspec/` tree — the BUILD arc's; and three `test_bullseye_widget.py`
      # quotations of `views/staging-workbench.js` / `swb-create.js` lines S5
      # rewrote). `test_doxbench_view.py` is the fourth and the one worth
      # stating in full: with
      # ONLY the S8 path repair applied it is 136 PASSED at `main`, and on this
      # branch it is 124 passed with 11 errors and 1 failure — every one of the
      # twelve a shell behaviour S5 and S7 changed under a suite nobody has run
      # since the carve ("timed out waiting for the canvas textareas"). So the
      # repair is complete and the residue is the authoring slices'; naming the
      # file here would put the required check red for their defect, and this
      # block records the measurement instead.
      #
      # `--noconftest` STAYS, and it is why this list is a list. The root
      # conftest's `collect_ignore` and `tests/conftest.py`'s autouse fixtures are
      # both written for a tree that can import `opendox.serve`; until it can,
      # a file named here has to stand on its own, and each of the seventeen
      # does.
      #
      # FIVE MORE SUITES COLLECT CLEANLY UNDER `--noconftest` AND ARE STILL NOT
      # NAMED, for two different reasons — collecting is what the tree blocker
      # denies the rest, and it is not by itself a reason to name a file.
      # Measured at this head, each run alone under this workflow's own
      # invocation:
      #
      #   ALL-SKIP, so naming them would add no assertion the check can fail on
      #   and would advertise coverage that is not running:
      #     tests/test_doxbench_bridge_live.py        8 skipped
      #     tests/test_openprofiler_broker_e2e.py     3 skipped
      #
      #   A STANDING RED THIS SLICE DOES NOT OWN (§ 3 of the S8 inventory), so
      #   naming one would put the required check red for another act's defect:
      #     tests/test_boundary.py            1 failed,  27 passed
      #     tests/test_provider_boundary.py  11 failed,  17 passed
      #     tests/test_workbench.py           2 failed,  26 passed, 3 skipped
      #
      # `test_provider_boundary.py`'s is itself a cross-leg reach worth naming:
      # it asserts that seven per-module scan suites still exist BY FILENAME,
      # and the carve sent all seven to openXdox-code.
      - name: pytest
        run: >-
          python -m pytest -q
          tests/test_leg_shape.py
          tests/test_consumer_reach.py
          tests/test_profile_registration.py
          tests/test_web_boundary.py
          tests/test_intent_binding_shape.py
          tests/test_view_registry.py
          tests/test_split_route_tails.py
          tests/test_source_core_arm.py
          tests/test_gate_loop_contributed.py
          tests/test_display_facet.py
          tests/test_account_menu_dom.py
          tests/test_doc_wheel.py
          tests/test_doxbench_accessibility.py
          tests/test_doxbench_context_panes.py
          tests/test_doxbench_document_abstract.py
          tests/test_doxbench_hash.py
          tests/test_doxbench_knowledge.py
          tests/test_doxbench_privacy.py
          tests/test_doxbench_proposal_discard.py
          tests/test_doxbench_proposals.py
          tests/test_doxbench_state.py
          tests/test_doxbench_thread_switch.py
          tests/test_doxbench_workspace.py
          tests/test_intent_binding_dom.py
          tests/test_lens_labels_at_scale.py
          tests/test_smoke_signals.py
          tests/test_wheel_paint_and_reach.py
          tests/test_binding_stylesheets.py
          --noconftest

      # § 3.4 SLICE S7 RESIDUE — `tests/test_display_facet_leaves.py`, as its
      # OWN STEP rather than a 28th entry on the list above. That is a merge
      # decision and it is measured, not preferred: openDox-code#27 (RULED Q7's
      # binding stylesheets) appends `tests/test_binding_stylesheets.py` at the
      # same tail, so a second append there is a textual conflict on whichever
      # of the two lands second — over a line whose ORDER carries no meaning.
      # A separate step conflicts with nothing, reports its own red/green in
      # the check's log, and is removable in one hunk if a later act folds the
      # file back onto the list.
      # THAT IS NOW MEASURED RATHER THAN FORECAST: #27 landed first
      # (`5c137a90`), and merging `main` into this leg auto-merged THIS FILE
      # with both appends intact — `tests/fixtures/web_boundary_census.yaml`'s
      # per-class totals were the merge's only conflict.
      #
      # It stands on the same footing as its neighbours above: it imports no
      # `opendox` submodule at all, reads bundle files as text, and drives the
      # REAL `views/display.js`, `views/explorer.js` and `views/outline-model.js`
      # under the `node` the runner already has (skipped, never failed, where
      # node is absent). `--noconftest` safe and needs no consumer, for the same
      # reason and by the same means as `tests/test_display_facet.py`.
      #
      # WHAT IT MEASURES that the eight slices above do not: seven LEAVES inside
      # modules slice S7 already parameterized at their mounts — the two threads
      # Copilot opened on #21 at `c7a216c7` and the five it left SUPPRESSED in
      # review `5192900474`'s body. `tests/test_web_boundary.py` assertion 4 is
      # green over six of the seven and always was: `captured` is in neither of
      # its word lists, a mount that forwards no option spells nothing at all,
