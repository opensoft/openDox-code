    note: "the read-only Markdown viewer; pure render plus the vendored markdown-it. CLEAN class A since slice S6: its content comes from /source/, which RULED Q4 makes openDox's own fixed core arm (opendox/serve.py), so the census's one former § 2.2 rule 1 breach is discharged -- the route moved, the file did not change"

  - path: views/wheel-model.js
