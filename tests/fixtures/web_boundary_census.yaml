# The declared census for `docs/front-end-package-boundary.md`
# (opensoft/openDox-spec #8 -> a44ac06d) § 3.2, read by
# `tests/test_web_boundary.py` -- slice S1, "declare the census and measure
# the defect" (opensoft/openxFactory#656 comment 5642758731, 2026-09-12,
# "RULED, same sitting -> START S1-S3 NOW, with the note amended to carry
# these rulings").
#
# Every file under `src/opendox/web/` (measured at openDox-code `main`
# `a99eba03e31a0aee1cc15a061fdf718cc88a2c44`, the same head the note itself
# measured) appears here EXACTLY ONCE, `path` relative to that directory.
# `tests/test_web_boundary.py::test_every_web_file_is_classified_exactly_once`
# is the ratchet: a new file with no row here fails it immediately (the note
# § 4.5 point 1) -- that is the whole point of a DECLARED census over an
# inferred one.
#
# Classes, per the note's § 2.1:
#   A   openDox core.  Names no governance status or stage word, and
#       addresses no route another column declares.
#   B   the gate loop. Its SUBJECT is a gate act; its binding belongs to
#       openXdox through the seam § 4 describes. Exempt, by construction,
#       from the route-ownership assertion (#2 below) -- a gate-loop file
#       naming a gate route is the boundary working, not breaking.
#   C   a stage-named region. Structurally neutral; its NAMES are one
#       domain's mapping and must be parameterized from the registered
#       domain profile (S7), never a literal.
#   "?" transitional. A SPLIT file carrying more than one class's substance
#       (class-A or class-C substance AND a class-B, or openxFactory-adapter,
#       tail). Legitimate ONLY until slice S4 does the split -- after S4 a
#       "?" row still standing fails the census assertion, because a
#       permanent "undecided" is an escape hatch, not a boundary (note § 4.5
#       point 1).
#
# `tail` (optional): set on a class-A row whose file ALSO carries a rendered
# label or a corpus path (note § 2.2 rule 3) -- the identifier is named so S7
# has a starting point. `note` (optional): free-text provenance, echoing the
# note's own `evidence` column.
#
# RULINGS APPLIED HERE, from opensoft/openxFactory#656 comment 5642758731
# (Brett Heap, 2026-09-12T02:07:53Z, "RULED -- § 3.4 front-end package
# boundary, the five open questions ... every recommended answer adopted"),
# amending the note's own § 3.2 table:
#
#   Q1  views/docs.js stays class A, its area map (`AREA_ORDER`) carried as
#       a declared C tail, parameterized at S7. No census change from the
#       note's own (recommendation-written) table.
#   Q2  views/explorer.js is class C OUTRIGHT -- reclassified here from the
#       note's "?" to "C": neither it nor the drill banner is class B, and
#       explorer.js's only domain content is the artifact-folder vocabulary
#       (a projection, not a split file). This is the one row this fixture
#       changes from the note's own table.
#   Q3  views/repo-selector.js SPLITS (picker + refresh -> A; the two
#       `/actions/gate/*` project commissions -> a contributed binding at
#       S4/S5; `/actions/apply-register-edits` leaves the bundle entirely)
#       -- stays "?" here because the split itself is slice S4's act, not
#       S1's; § 4.5 point 1 keeps "?" legitimate until then. The same rule
#       (“a route constant travels with the binding that calls it, never
#       with the model that declares it”) leaves `views/lens-model.js` and
#       `views/staging-workbench-model.js` at "?" for the same reason.
#   Q4  `/source/` is openDox's; discharged at slice S6 by moving the ROUTE
#       (`openxdox/serve_projection.py`), not by reclassifying `views/viewer.js`
#       here -- it stays class A, its one ownership breach carried as a
#       `note`.
#   Q5  views/intent-feed.js keeps RULED OQ-F (`not_moved`, openxFactory's);
#       its two importers (`dispose.js`, `wheel.js`) are fixed at slice S2,
#       not by any census reclassification here.
#
# Totals after Q2's reclassification, AS MEASURED AT a99eba03 (unchanged
# from the note otherwise):
#   A  20 files (18 hand-authored + 2 vendored), 11,702 lines
#   B  4 files, 1,597 lines
#   C  14 files (13 + explorer.js), 11,854 lines (11,575 + 279)
#   ?  4 files (5 - explorer.js), 5,432 lines (5,711 - 279)
#   total 42 files, 30,585 lines -- unchanged (a reclassification, not a move)
#
# S3 ADDITION (opensoft/openDox-code#14, slice S3's own leg): a 43rd file
# arrives, `views/view_extension.js` (422 lines) -- the client-side view
# registry. The note's own census could carry no row for it because the note
# measured the tree at `a99eba03`, before this file existed. Class A: no
# import (so it cannot violate assertion 3), no governance literal (out of
# assertion 4's scope regardless, which is class C plus declared tails), and
# its one route-shaped string, `'gate.bar'` (an example in a doc comment), is
# an ID, not a `/actions/...` path -- assertion 2's patterns do not match it.
#   A  21 files, 12,284 lines (11,702 + 422 + 127 app.js growth + 33 review round)
#   total 43 files, 31,167 lines (30,585 + 422 + 127 + 33); B/C/? unchanged
#
# AMENDMENT (S2, opensoft/openDox-code 330cf816, merged into this leg after
