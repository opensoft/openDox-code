    note: "S3 ADDITION: the client-side view registry -- ViewBinding/collectViewBindings, route_extension.py's shape mirrored in JS (openDox-spec § 4.1). No import, no governance literal; 'gate.bar' in a doc comment is a documentation example of an id, not a route literal, so assertion 2 does not match it. loc 422 -> 455 on this PR's own review round (Copilot, PR #14): a malformed contributed_routes now refuses instead of silently disabling the ownership check, and a rejected dynamic import now refuses naming the binding and module instead of leaking a raw error. loc 455 -> 463 on S4: two new REGIONS entries (lens-gate, repo-projects) for the two new class-B bindings' shell mounts, and the doc comment naming them. loc 463 -> 499 on this fix (Copilot, PR #16, view_extension.js:358): manifestRoutes() and ownershipBreach() now share one shape check, refusing a contributed-routes entry missing a string pattern or carrying a non-boolean is_prefix at whichever of the two sees it first, instead of the array-only check at manifestRoutes() and a truthy is_prefix read at ownershipBreach() silently letting a malformed entry through as if it were not a prefix match. loc 499 -> 757 on S5: RULED Q2's declared namespace and its Proxy, RULED Q4's capability probe and refusal, and RULED Q1's generic mount pass. loc 757 -> 824 on S5's round-2 review (Copilot): probeCapabilityPath reads OWN properties only (an inherited `toString` met a requirement); every DECLARED export is checked callable the way `entry` is (RULED Q2); resolveBinding() resolves the binding a caller already holds, so the generic pass cannot mount a same-id binding from another region; and the pass takes a `regions` bound."

