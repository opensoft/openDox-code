# ASSERTION 1's ONE DECLARED, RULED-LATER EXCEPTION (note § 4.5 point 1). After
# slice S4 the census assertion fails on any row still "?" OR still "SPLIT" --
# "a permanent UNDECLARED 'undecided' is an escape hatch, not a boundary; a
# permanent DECLARED one, cited to the ruling gap that causes it, is how this
# census stays honest about what it does not yet know". This list is that
# declaration, and it is the ONLY way a transitional row may still stand.
# `until` names what would discharge it, so the exception cannot quietly
# outlive its cause.
declared_transitional_rows:
  - path: views/lens.js
    class: "?"
    until: "a future ruling on views/lens.js's two openxFactory-lane routes"
    reason: >-
      none of Q1-Q5 rules on this file (openxFactory#656 comment 5642758731):
      DTN_SEED_ROUTE and STAGING_SEED_ROUTE are answered ONLY by openxFactory's
      own adapter, a THIRD column (note § 3.3), and RULING DQ-1 keeps that
      column at openxFactory. It is out of scope for this ruling round, NOT
      undecided by omission -- § 5's S4 row says so in terms ("lens.js is OUT OF
      SCOPE ... it stays `?` as assertion 1's one declared, ruled-later
      exception") -- and it stays "?" until a later ruling names its
      destination.

# ASSERTION 2's OWN STANDING, DECLARED EXCEPTION (note § 4.5 point 2, last
# paragraph): "lens.js's two openxFactory-lane sites are this assertion's own
# standing, declared exception -- the same idiom assertion 4 uses for its two
# schema-key exemptions: named here, with the reason beside it, EXCLUDED FROM
# THE IN-SCOPE GREP until a future ruling folds lens.js back in. This is why
# S5's and S6's xfail(strict=True) removal still leaves the test green: the
# marker comes off because every OTHER site it was tolerating is fixed, not
# because lens.js's two sites started passing the grep -- they never entered
# it."
#
# Keyed by (path, route) and NEVER by line number: a line number in a declared
# exception rots the first time anything above it moves, and this file's own
# S1 rows already carried five stale ones. Each route is checked to be really
# present in the file it exempts, so the exception cannot outlive the site.
route_ownership_exceptions:
  - path: views/lens.js
    routes:
      - "/actions/dtn-seed"
      - "/actions/staging-seed"
    until: "a future ruling on views/lens.js's two openxFactory-lane routes"
    reason: >-
      the same ruling gap `declared_transitional_rows` names: none of Q1-Q5
      rules on views/lens.js, so its two openxFactory-lane sites do not clear on
      any slice's schedule (note § 4.5 point 2's own table: "future ruling",
      not S4/S5/S6). A THIRD undeclared "?" row or an unresolved SPLIT row
      appearing later still fails immediately, the same ratchet assertion 1
      enforces.

# The two identifiers § 2.2 rule 3 declares EXEMPT from the governance-literal
# sweep (assertion 4) -- carried here WITH THE REASON, per the note's own
# instruction ("an exemption that is silence is how a literal survives a
# vocabulary sweep"). Both live in plain class-A files (no `tail`), so they
# are already outside assertion 4's scope by construction; this list is the
# DECLARED record of why, checked for real by
# `test_declared_governance_literal_exemptions_are_real_and_out_of_scope`.
declared_exemptions:
  - path: views/composed-model.js
    identifier: COMPOSED_COLLECTIONS
    reason: >-
      six SNAPSHOT FIELD NAMES (documents, clusters, possibles, staged_topics,
      changes, keyword_index), never rendered -- a schema key, not a stage
      name (note § 2.2 rule 3).
  - path: views/doxbench-state.js
    identifier: SCOPE_KINDS
    reason: >-
      the three tile kinds a workbench session may be scoped to -- a state
      key, never a label (note § 2.2 rule 3).
  # THE ELEVEN SEAM TABLES of the display facet's client half. Every one of
  # them is § 2.2 rule 3's schema half -- a key one END of a seam writes and the
  # other end reads, never a word a human is shown -- and every one is declared
  # HERE, once, in a class-A module, so that the fourteen class-C files reach
  # the seam through a ROLE and carry none of the keys. A row-level `exempt:`
  # list on `views/display.js` names the same eleven and
  # `test_every_row_level_exempt_matches_the_declared_exemptions_for_that_path`
  # holds the two to set equality: S1's REGISTER, defect (b), which was that
  # the row and the list were never compared and a scalar `exempt:` could only
  # ever have named one of them.
  - path: views/display.js
    identifier: SNAPSHOT_FIELDS
    reason: >-
      S7's declaration of § 2.2 rule 3's other half: the snapshot's six field
      names (documents, clusters, possibles, staged_topics, changes) and the
      closed `changes[].status` enum (active / archived), declared ONCE in a
      class-A module so that the fourteen class-C files read the snapshot
      through a ROLE and carry none of them. These are openDox's own schema --
      a descendant that renamed `clusters` would be shipping a different
      snapshot, not a different domain -- so a class-A file MAY read them and
      this file is where they are read.
  - path: views/display.js
    identifier: ACT_IDS
    reason: >-
      the gate column's five verb KEYS. The CONTRIBUTED column dispatches on the
      id and `views/wheel-model.js` declares which verb row a wheel offers, so
      the two ends must spell it identically -- exactly as a route pattern must.
      What a human sees beside each row is `display.act(role)`.
  - path: views/display.js
    identifier: TILE_KINDS
    reason: >-
      the `/actions/notebook` payload's own tile-kind keys, by stage role;
      openDox's `notebook_action.py` declares the enum and the browser must
      spell it identically. Never rendered.
  - path: views/display.js
    identifier: SCOPE_KINDS
    reason: >-
      the staging workbench's scope-kind keys, by stage role. The wheel, the
      workbench and the stored session state are all keyed by them;
      `views/doxbench-state.js` declares the same closed set at the other end
      (its own row, above).
  - path: views/display.js
    identifier: TAB_IDS
    reason: >-
      the workbench's three tab keys -- the key the panel switch, the retained
      per-tab state and the contributed create column are filed under, and the
      stem of the `.swb-pane-<tab>` style hook. What a human reads on the first
      tab is `display.short(role)`.
  - path: views/display.js
    identifier: SESSION_SCOPE_KINDS
    reason: >-
      the branch-session transport's own scope vocabulary, keyed by scope kind.
      A CROSS-PROCESS seam: `src/opendox/branch_session.py` reads exactly these
      words off the wire, so a respelling opens a session the engine cannot
      resolve.
  - path: views/display.js
    identifier: SESSION_BRANCH_NAMESPACES
    reason: >-
      the git ref namespace each scope kind's session branch is cut under,
      mirroring `branch_session.session_branch`. `git check-ref-format` bounds
      what these may be, which is another way of saying they are not vocabulary
      -- and a respelling here names a branch nobody is on.
  - path: views/display.js
    identifier: SNAPSHOT_VALUES
    reason: >-
      the snapshot's two closed enums by role -- `documents[].stage` and
      `possibles[].state`. Values the renderer MATCHES (which column a card
      belongs in, which dot a candidate wears) and never RENDERS: every word a
      human reads comes from `display.status(...)`. Every profile in the estate
      registers WITHOUT a DISPLAY facet today, so a board that filtered on the
      facet's neutral word would show an empty column against the very snapshot
      it renders.
  - path: views/display.js
    identifier: DRILL_KINDS
    reason: >-
      the explorer's tile-kind keys, by stage role -- the board, the funnel, the
      wheel and the explorer must spell them identically to open the same
      artifact folder.
  - path: views/display.js
    identifier: DRAFT_PATHS
    reason: >-
      the cluster canvas's draft file-name prefixes. A cross-PROCESS path
      contract: `src/opendox/canvas_drafts.py` builds the same names on the
      server, so a drafted file would otherwise land where nothing reads it.
  - path: views/display.js
    identifier: SECTION_ORDER
    reason: >-
      the staging template's canonical heading order, MATCHED against headings a
      human already wrote to decide where a new section goes, never rendered.
      openDox ships the order it has always shipped so no install loses its
      outline ordering to a facet nobody has declared yet; a host may override
      it on the payload (`sections`).


# ---------------------------------------------------------------------------
# SLICE S7's TWO DECLARED EXEMPTION CLASSES for assertion 4. The note's § 2.2
# rule 3 says "an exemption that is silence is how a literal survives a
# vocabulary sweep"; both of these are the other thing -- declared here, beside
# the reason, and CHECKED by `tests/test_web_boundary.py`, which refuses a
# style hook that is not a real selector and a prose exemption whose literal is
# not present in the file.
# ---------------------------------------------------------------------------

# THE STYLE-HOOK RULE, stated once. Every COMPOUND class token declared as a
# real selector in `styles.css` may be spelled in a class string, because a
# class name is the other end of a CSS rule and RULED Q7 (openxFactory#656
# comment `5648049748`) keeps `styles.css`'s own surface stable: "openDox's
# declared design tokens (the `--st-*` family, S7) are the one stable styling
# surface; nothing else in `styles.css` is." A BARE governance word is never a
# hook: `"staged"` is ambiguous between a class and the word a card renders,
# and a sweep that guessed would be guessing about exactly the thing it
# measures. `.lchip-selection` cannot be either.
#
# The list below is the hooks in the in-scope files that carry a governance
# word, enumerated so a REVIEWER sees them; the test derives the legal set from
# `styles.css` itself, so a hook that stops being a selector stops being legal
# whether or not anyone edits this list.
style_hooks:
  rule: >-
    a compound class token (it carries a "-") that `styles.css` declares as a
    real `.<token>` selector. Derived from the stylesheet, never from this list.
  carrying_a_governance_word:
    - stage-brainstorm
    - stage-staged
    - stage-proposal
    - stage-realized
    - cluster-card
    - lineage-cluster
    - collapsed-docs
    - only-docs
    - draft-confirm
    - doxchat-proposals
    - swb-pane-docs
    - swb-tab-active
    - swb-subtab-active

# THE SIX PLAIN-ENGLISH SITES. Each is the ordinary English verb or noun
# "draft" -- what a human DOES to a document before anyone commits it -- in a
# sentence about `views/canvas.js`'s own draft-and-confirm affordance. None of
# them is a status word: the cluster canvas never writes a `Status:` and the
# register entry it previews is drafted, not staged. The neighbouring word that
# IS a status (`superseded`) resolves through the facet in the same sentences.
#
# Keyed by (path, literal) and CHECKED PRESENT, so a reflow cannot move an
# exemption onto a different string and a deleted sentence leaves a stale
# exemption that the test refuses.
prose_exemptions:
  - path: views/canvas.js
    literal: " — choose one; siblings draft "
    reason: >-
      the plain English verb, in the option-set caption -- "siblings draft a
      supersede note", which is what a human does, not a status anything
      carries.
  - path: views/canvas.js
    literal: "choose this — draft the sibling "
    reason: the same caption's other half, the same verb.
  - path: views/canvas.js
    literal: " → draft register entry (human commits)"
    reason: >-
      the candidate-register affordance's own label: the entry is DRAFTED here
      and committed by a human, which is the whole point of the sentence and
      the reason `openDox` never writes the register itself.
  - path: views/canvas.js
    literal: "draft register entry (human commits)"
    reason: the same label on the confirm step.
  - path: views/canvas.js
    literal: "nothing to draft for this selection"
    reason: the same verb, in the empty state of the same affordance.
  - path: views/canvas.js
    literal: "a draft a human commits — machinery enters nothing into the register."
    reason: >-
      the legend sentence that STATES the rule the five labels above follow --
      "a draft a human commits" is the noun for an uncommitted file, and the
      sentence exists precisely to say that machinery writes nothing.
